<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WorkSafePro</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef7ff;font-family:Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#071827,#073c4b,#00856f);padding:16px;text-align:center;box-shadow:0 8px 22px #0008}h1{margin:0;font-size:26px}small{color:#d3fff4}.wrap{padding:14px 14px 88px;max-width:900px;margin:auto}.hero{background:linear-gradient(135deg,#0d2437,#0b6b55 70%,#2f8cff);border:1px solid #1e4962;border-radius:22px;padding:18px;margin-bottom:12px}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#d8fff5;line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.box,.item{background:#101c2e;border:1px solid #263b55;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 10px 24px #0005}.card b{font-size:28px;color:#00c896}.mut{color:#9db0c4;font-size:14px}.menu button,.btn{width:100%;min-height:52px;border:0;border-radius:15px;padding:12px;margin-top:9px;font-size:16px;font-weight:900;background:linear-gradient(135deg,#00c896,#45e5c3);color:#03120e}.btn2{background:#0e1828;color:#d8f6ff;border:1px solid #31506d}.btnR{background:#321021;color:#ffc1cd;border:1px solid #77344a}.menu button{display:grid;grid-template-columns:42px 1fr 20px;align-items:center;gap:12px;text-align:left;background:#101c2e;color:#eef7ff;border:1px solid #263b55}.ico{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#003b49,#00c896);display:grid;place-items:center;color:#03120e;font-weight:900}.bottom{position:fixed;bottom:0;left:0;right:0;background:#07111f;border-top:1px solid #263b55;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px}.bottom button{min-height:52px;border-radius:14px;border:1px solid #263b55;background:#0e1828;color:#9db0c4;font-weight:900}.bottom button.on{background:linear-gradient(135deg,#004a5c,#00c896);color:#03120e}label{display:block;margin-top:10px;font-size:13px;font-weight:900;color:#b8c7d8}input,select,textarea{width:100%;min-height:48px;background:#081321;color:#eef7ff;border:1px solid #31506d;border-radius:12px;padding:11px;font-size:16px;margin-top:5px}textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section{background:linear-gradient(135deg,#003b49,#00c896);color:#03120e;border-radius:12px;padding:10px;font-weight:900;margin:14px 0 8px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #31506d;border-radius:999px;padding:9px 11px;background:#081321;color:#d8e8f8;font-weight:800}.chip input{width:auto;min-height:auto;margin:0 4px 0 0}.sig{background:white;height:145px;border-radius:13px;margin-top:7px;touch-action:none}.sig canvas{width:100%;height:145px;display:block}.photo{border:1px dashed #31506d;border-radius:14px;min-height:130px;display:grid;place-items:center;margin-top:8px;color:#9db0c4;overflow:hidden}.photo img{max-width:100%;max-height:240px}.empty{text-align:center;color:#9db0c4;padding:30px 10px;border:1px dashed #31506d;border-radius:16px;background:#0e1828}@media print{body{background:white;color:#111}.noPrint,header,.bottom{display:none!important}.wrap{padding:0}.box{box-shadow:none;border:1px solid #333;color:#111;background:white}.section{color:white;background:#123}.mut{color:#333}}</style></head><body><header class="noPrint"><h1>WorkSafePro</h1><small>Segurança do Trabalho em Campo</small></header><main id="app" class="wrap"></main><nav class="bottom noPrint"><button id="bhome" onclick="go('home')">Início</button><button id="bpse" onclick="go('pse')">PSe</button><button id="binsp" onclick="go('insp')">Inspeção</button><button id="bepi" onclick="go('epi')">EPI</button><button id="bmore" onclick="go('more')">Mais</button></nav><script>const K='wsp-stable-2026';let db=JSON.parse(localStorage.getItem(K)||'{"pse":[],"insp":[],"epi":[],"trab":[],"rnc":[],"dds":[]}'),view='home',edit=null,photoData='',sigs={};const riscos={Altura:['Queda de pessoa','Queda de material','Ancoragem inadequada','Condição climática'],Eletrico:['Choque elétrico','Arco elétrico','Energização acidental','Ausência de bloqueio'],Quente:['Incêndio','Explosão','Queimadura','Fagulhas'],Confinado:['Atmosfera perigosa','Baixo oxigênio','Resgate difícil','Engolfamento'],Escavacao:['Soterramento','Queda no interior','Interferência subterrânea','Acesso inadequado'],Geral:['Prensamento','Corte','Ruído','Poeira','Postura inadequada']};function save(){localStorage.setItem(K,JSON.stringify(db))}function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function go(v){view=v;edit=null;photoData='';sigs={};render();scrollTo(0,0)}function mark(){['home','pse','insp','epi','more'].forEach(x=>{let b=document.getElementById('b'+x);if(b)b.className=view==x?'on':''})}function render(){mark();if(view==='home')home();else if(view==='pse')list('pse','Permissão de Trabalho','Nova Permissão de Trabalho');else if(view==='insp')list('insp','Inspeções de Campo','Nova Inspeção');else if(view==='epi')list('epi','Controle de EPI','Nova Entrega/Controle');else if(view==='more')more();else if(view==='trab')list('trab','Trabalhadores','Novo Trabalhador');else if(view==='rnc')list('rnc','RNC','Nova Não Conformidade');else if(view==='dds')list('dds','DDS','Novo DDS')}function home(){app.innerHTML='<div class="hero"><h2>Central de Campo</h2><p>Registre PT/PSe, inspeções, EPIs, trabalhadores, RNC e DDS direto no celular. Dados offline.</p></div><div class="grid"><div class="card"><b>'+db.pse.length+'</b><div class="mut">Permissões</div></div><div class="card"><b>'+db.insp.length+'</b><div class="mut">Inspeções</div></div><div class="card"><b>'+db.epi.length+'</b><div class="mut">EPIs</div></div><div class="card"><b>'+db.rnc.length+'</b><div class="mut">RNC</div></div></div><div class="menu">'+m('PT','Permissão de Trabalho','Documento com riscos automáticos, executantes e assinatura','go(\'pse\')')+m('IN','Inspeção de Campo','Checklist, situação, evidência e ações','go(\'insp\')')+m('EP','Controle de EPI','Entrega, estoque e assinatura','go(\'epi\')')+m('TR','Trabalhadores','Cadastro da equipe','go(\'trab\')')+m('RN','RNC','Não conformidade e prazo de ação','go(\'rnc\')')+m('DD','DDS','Registro de diálogo de segurança','go(\'dds\')')+'</div>'}function m(i,t,s,a){return '<button onclick="'+a+'"><span class="ico">'+i+'</span><span><b>'+t+'</b><br><small class="mut">'+s+'</small></span><span>›</span></button>'}function more(){app.innerHTML='<div class="hero"><h2>Mais módulos</h2><p>Acesso rápido aos cadastros auxiliares.</p></div><div class="menu">'+m('TR','Trabalhadores','Cadastro da equipe','go(\'trab\')')+m('RN','RNC','Gestão de não conformidade','go(\'rnc\')')+m('DD','DDS','Diálogo diário de segurança','go(\'dds\')')+'</div><div class="box"><button class="btn btn2" onclick="backup()">Exportar backup JSON</button><label>Importar backup<input type="file" accept="application/json" onchange="importBackup(this)"></label></div>'}function list(k,t,btn){let arr=db[k]||[];app.innerHTML='<div class="hero"><h2>'+t+'</h2><p>Adicionar, editar, apagar, visualizar e exportar.</p></div><button class="btn" onclick="form(\''+k+'\')">'+btn+'</button>'+(arr.length?arr.map((x,i)=>'<div class="item"><b>'+esc(x.titulo||x.nome||x.tipo||t)+'</b><div class="mut">'+esc(x.data||'')+' '+esc(x.local||x.funcionario||'')+'</div><button class="btn btn2" onclick="viewRec(\''+k+'\','+i+')">Visualizar/PDF</button><button class="btn btn2" onclick="form(\''+k+'\','+i+')">Editar</button><button class="btn btnR" onclick="del(\''+k+'\','+i+')">Apagar</button></div>').join(''):'<div class="empty">Nenhum registro cadastrado.</div>')}function del(k,i){if(confirm('Apagar registro?')){db[k].splice(i,1);save();render()}}function form(k,i){edit=i;let r=i!=null?db[k][i]:{};photoData=r.foto||'';sigs={ass:r.ass||''};if(k==='pse')return formPse(r);if(k==='insp')return formInsp(r);if(k==='epi')return formEpi(r);if(k==='trab')return formTrab(r);if(k==='rnc')return formRnc(r);if(k==='dds')return formDds(r)}function baseFields(r){return '<div class="row"><label>Data<input id="data" type="date" value="'+esc(r.data||new Date().toISOString().slice(0,10))+'"></label><label>Local<input id="local" value="'+esc(r.local||'')+'"></label></div>'}function formPse(r){app.innerHTML='<div class="hero"><h2>Permissão de Trabalho</h2><p>Riscos automáticos por tipo, campos manuais, executantes e assinatura.</p></div><div class="box"><div class="section">Informações gerais</div>'+baseFields(r)+'<label>Empresa<input id="empresa" value="'+esc(r.empresa||'')+'"></label><label>Tipo de trabalho<select id="tipo" onchange="autoRiscos()"><option>Geral</option><option>Altura</option><option>Eletrico</option><option>Quente</option><option>Confinado</option><option>Escavacao</option></select></label><label>Descrição<textarea id="desc">'+esc(r.desc||'')+'</textarea></label><label>Executantes com função<textarea id="exec" placeholder="Nome - Função">'+esc(r.exec||'')+'</textarea></label><div class="section">Riscos automáticos e adicionais</div><div id="riskBox"></div><label>Riscos adicionais<textarea id="riskExtra">'+esc(r.riskExtra||'')+'</textarea></label><div class="section">Medidas / checklist</div>'+checks(r)+'<div class="section">Assinatura do responsável</div>'+sigBox('ass')+'<div class="section">Evidência fotográfica</div>'+photoBox()+'<button class="btn" onclick="savePse()">Salvar PSe</button><button class="btn btn2" onclick="savePse(true)">Salvar e visualizar/PDF</button><button class="btn btnR" onclick="go(\'pse\')">Cancelar</button></div>';document.getElementById('tipo').value=r.tipo||'Geral';autoRiscos(r.riscos);setupSig('ass',r.ass)}function autoRiscos(old){let tipo=document.getElementById('tipo').value;let rs=old||riscos[tipo]||riscos.Geral;riskBox.innerHTML=rs.map(x=>'<label class="chip"><input type="checkbox" checked> '+esc(x)+'</label>').join('')}function checks(r){let c=r.check||{};let qs=['Área isolada e sinalizada','EPI obrigatório disponível','Ferramentas inspecionadas','Equipe orientada','Emergência definida','Permissão aprovada'];return qs.map((q,i)=>'<label class="chip"><input type="checkbox" id="c'+i+'" '+(c[q]?'checked':'')+'> '+q+'</label>').join('')}function formInsp(r){app.innerHTML='<div class="hero"><h2>Inspeção de Campo</h2><p>Registro rápido com situação, checklist e evidência.</p></div><div class="box">'+baseFields(r)+'<label>Atividade inspecionada<input id="titulo" value="'+esc(r.titulo||'')+'"></label><label>Situação<select id="situacao"><option>Conforme</option><option>Não conforme</option><option>Parcial</option></select></label><label>Observações<textarea id="obs">'+esc(r.obs||'')+'</textarea></label>'+photoBox()+'<button class="btn" onclick="saveSimple(\'insp\')">Salvar</button></div>';situacao.value=r.situacao||'Conforme'}function formEpi(r){app.innerHTML='<div class="hero"><h2>Controle de EPI</h2><p>Entrega ou controle de estoque com assinatura.</p></div><div class="box">'+baseFields(r)+'<label>Funcionário<input id="funcionario" value="'+esc(r.funcionario||'')+'"></label><label>EPI<input id="titulo" value="'+esc(r.titulo||'')+'"></label><div class="row"><label>CA<input id="ca" value="'+esc(r.ca||'')+'"></label><label>Quantidade<input id="qtd" type="number" value="'+esc(r.qtd||1)+'"></label></div><label>Observação<textarea id="obs">'+esc(r.obs||'')+'</textarea></label><div class="section">Assinatura do funcionário</div>'+sigBox('ass')+'<button class="btn" onclick="saveSimple(\'epi\')">Salvar</button></div>';setupSig('ass',r.ass)}function formTrab(r){app.innerHTML='<div class="hero"><h2>Trabalhador</h2><p>Cadastro da equipe.</p></div><div class="box"><label>Nome<input id="nome" value="'+esc(r.nome||'')+'"></label><label>Função<input id="funcao" value="'+esc(r.funcao||'')+'"></label><label>Empresa<input id="empresa" value="'+esc(r.empresa||'')+'"></label><label>Treinamentos<textarea id="obs" placeholder="NR-35 válido até...">'+esc(r.obs||'')+'</textarea></label><button class="btn" onclick="saveSimple(\'trab\')">Salvar</button></div>'}function formRnc(r){app.innerHTML='<div class="hero"><h2>RNC</h2><p>Não conformidade com ação e prazo.</p></div><div class="box">'+baseFields(r)+'<label>Título<input id="titulo" value="'+esc(r.titulo||'')+'"></label><label>Descrição<textarea id="obs">'+esc(r.obs||'')+'</textarea></label><label>Ação corretiva<textarea id="acao">'+esc(r.acao||'')+'</textarea></label><label>Prazo<input id="prazo" type="date" value="'+esc(r.prazo||'')+'"></label><button class="btn" onclick="saveSimple(\'rnc\')">Salvar</button></div>'}function formDds(r){app.innerHTML='<div class="hero"><h2>DDS</h2><p>Diálogo diário de segurança.</p></div><div class="box">'+baseFields(r)+'<label>Tema<input id="titulo" value="'+esc(r.titulo||'')+'"></label><label>Participantes<textarea id="participantes">'+esc(r.participantes||'')+'</textarea></label><label>Resumo<textarea id="obs">'+esc(r.obs||'')+'</textarea></label><button class="btn" onclick="saveSimple(\'dds\')">Salvar</button></div>'}function photoBox(){return '<input id="foto" type="file" accept="image/*" onchange="loadPhoto(this)"><div class="photo" id="photoPrev">'+(photoData?'<img src="'+photoData+'">':'Nenhuma foto')+'</div>'}function loadPhoto(inp){let f=inp.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{photoData=rd.result;photoPrev.innerHTML='<img src="'+photoData+'">'};rd.readAsDataURL(f)}function sigBox(id){return '<div class="sig"><canvas id="'+id+'"></canvas></div><button class="btn btn2" onclick="clearSig(\''+id+'\')">Limpar assinatura</button>'}function setupSig(id,data){let c=document.getElementById(id),ctx=c.getContext('2d'),down=false,last=null;function size(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=3;ctx.strokeStyle='#123';ctx.lineCap='round';if(data){let img=new Image();img.onload=()=>ctx.drawImage(img,0,0,r.width,r.height);img.src=data}}function pos(e){let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}function st(e){e.preventDefault();down=true;last=pos(e)}function mv(e){if(!down)return;e.preventDefault();let p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;sigs[id]=c.toDataURL('image/png')}function en(){down=false;sigs[id]=c.toDataURL('image/png')}setTimeout(size,50);c.addEventListener('touchstart',st,{passive:false});c.addEventListener('touchmove',mv,{passive:false});c.addEventListener('touchend',en);c.addEventListener('mousedown',st);c.addEventListener('mousemove',mv);window.addEventListener('mouseup',en)}function clearSig(id){let c=document.getElementById(id);c.getContext('2d').clearRect(0,0,c.width,c.height);sigs[id]=''}function savePse(open){let tipo=document.getElementById('tipo').value;let rs=[...riskBox.querySelectorAll('input:checked')].map(x=>x.parentNode.textContent.trim());let check={};['Área isolada e sinalizada','EPI obrigatório disponível','Ferramentas inspecionadas','Equipe orientada','Emergência definida','Permissão aprovada'].forEach((q,i)=>check[q]=document.getElementById('c'+i).checked);let rec={data:data.value,local:local.value,empresa:empresa.value,tipo,desc:desc.value,exec:exec.value,riscos:rs,riskExtra:riskExtra.value,check,ass:sigs.ass||'',foto:photoData,titulo:'PSe - '+tipo};if(edit!=null)db.pse[edit]=rec;else db.pse.unshift(rec);save();let ix=edit!=null?edit:0;if(open)viewRec('pse',ix);else go('pse')}function saveSimple(k){let rec={};['data','local','titulo','nome','funcionario','funcao','empresa','obs','situacao','ca','qtd','acao','prazo','participantes'].forEach(id=>{let e=document.getElementById(id);if(e)rec[id]=e.value});rec.ass=sigs.ass||'';rec.foto=photoData;if(edit!=null)db[k][edit]=rec;else db[k].unshift(rec);save();go(k)}function viewRec(k,i){let r=db[k][i];let html='<div class="hero noPrint"><h2>Visualização</h2><p>Use o botão abaixo para salvar em PDF.</p></div><button class="btn noPrint" onclick="printDoc()">Salvar PDF / Imprimir</button><button class="btn btn2 noPrint" onclick="go(\''+k+'\')">Voltar</button><div class="box"><div class="section">WorkSafePro - '+esc(titleName(k))+'</div>'+Object.keys(r).filter(x=>!['foto','ass','check','riscos'].includes(x)).map(x=>'<p><b>'+esc(x)+':</b> '+esc(r[x])+'</p>').join('')+(r.riscos?'<p><b>Riscos:</b> '+esc(r.riscos.join(', '))+'</p>':'')+(r.check?'<p><b>Checklist:</b><br>'+Object.keys(r.check).map(x=>(r.check[x]?'☑ ':'☐ ')+esc(x)).join('<br>')+'</p>':'')+(r.ass?'<p><b>Assinatura registrada:</b> Sim</p><img style="background:white;max-width:100%;height:120px" src="'+r.ass+'">':'')+(r.foto?'<p><b>Foto:</b></p><img style="max-width:100%" src="'+r.foto+'">':'')+'</div>';app.innerHTML=html}function titleName(k){return{pse:'Permissão de Trabalho',insp:'Inspeção',epi:'EPI',trab:'Trabalhador',rnc:'RNC',dds:'DDS'}[k]||'Registro'}function printDoc(){if(window.Android&&Android.printPage)Android.printPage('WorkSafePro');else window.print()}function backup(){let a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(db,null,2));a.download='worksafepro-backup.json';a.click()}function importBackup(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render()}catch(e){alert('Backup inválido')}};r.readAsText(f)}render()</script></body></html>
