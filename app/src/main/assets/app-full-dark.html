<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WorkSafePro</title><style>*{box-sizing:border-box}:root{--bg:#08111f;--bg2:#0d1b2e;--card:#111c2e;--line:#24364d;--txt:#eef7ff;--mut:#9db0c4;--g:#00c896;--b:#2f8cff;--r:#ff4c4c}body{margin:0;background:radial-gradient(circle at top,#102b3a 0,#08111f 40%,#050b14 100%);font-family:Arial,sans-serif;color:var(--txt)}.top{background:linear-gradient(135deg,#071827,#0c3b45,#007f68);color:white;padding:18px;text-align:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #15384b}.top h1{margin:0}.main{padding:16px 16px 92px;max-width:960px;margin:auto}.hero{background:linear-gradient(135deg,#0d2437,#0b6b55 70%,#2f8cff);color:white;border:1px solid #1e4962;border-radius:24px;padding:22px;margin-bottom:14px;box-shadow:0 18px 34px #0008}.hero h2{margin:0 0 8px}.hero p{margin:0;color:#d7fff4;line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.module,.item{background:linear-gradient(180deg,#132033,#0e1828);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 12px 26px #0006}.card b{font-size:28px;color:var(--g)}.module{width:100%;display:grid;grid-template-columns:56px 1fr 20px;gap:12px;align-items:center;text-align:left;margin-top:12px;color:var(--txt)}.ico{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#003b49,#00c896);display:grid;place-items:center;font-size:28px}.mut{color:var(--mut);font-size:14px}.btn{width:100%;min-height:54px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--g),#42e6c0);color:#03120e;font-weight:900;font-size:16px;margin-top:10px}.btn2{background:#0e1828;color:#d8f6ff;border:1px solid #31506d}.btnR{background:#2b1220;color:#ffb4c1;border:1px solid #693044}.bottom{position:fixed;bottom:0;left:0;right:0;background:#08111f;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}.bottom button{border:1px solid #1b2d42;background:#0e1828;color:#90a2b6;min-height:56px;border-radius:16px;font-weight:900}.bottom button:active,.bottom button.on{background:linear-gradient(135deg,#004a5c,#00c896);color:#03120e}.empty{text-align:center;background:#0e1828;border:1px dashed #2d425b;border-radius:18px;padding:36px 12px;color:var(--mut);margin-top:12px}@media(min-width:760px){.mods{display:grid;grid-template-columns:1fr 1fr;gap:12px}.module{margin-top:0}.bottom{max-width:960px;left:50%;transform:translateX(-50%);border-radius:18px 18px 0 0}}</style></head><body><header class="top"><h1>WorkSafePro</h1><small>Segurança do Trabalho em Campo</small></header><main id="app" class="main"></main><nav class="bottom"><button onclick="go('home')">Início</button><button onclick="openPse()">PSe</button><button onclick="go('insps')">Inspeção</button><button onclick="go('epis')">EPI</button></nav><script>const K='wsp-full-dark';let db=JSON.parse(localStorage.getItem(K)||'{"insps":[],"epis":[],"workers":[],"rncs":[],"dds":[]}'),cur='home';function save(){localStorage.setItem(K,JSON.stringify(db));render()}function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}function go(x){cur=x;render();scrollTo(0,0)}function openPse(){location.href='app-pse-dark2.html'}function mod(i,t,s,g){return '<button class="module" onclick="'+g+'"><div class="ico">'+i+'</div><div><b>'+t+'</b><div class="mut">'+s+'</div></div><div>›</div></button>'}function render(){if(cur=='home')home();else page(cur)}function home(){app.innerHTML='<div class="hero"><h2>Central de Campo</h2><p>App completo com visual escuro, verde segurança e azul. PSe profissional, inspeções, EPIs, trabalhadores, RNC e DDS.</p></div><div class="grid"><div class="card"><b>PSe</b><div class="mut">Permissão profissional</div></div><div class="card"><b>'+db.insps.length+'</b><div class="mut">Inspeções</div></div><div class="card"><b>'+db.epis.length+'</b><div class="mut">EPIs</div></div><div class="card"><b>'+db.workers.length+'</b><div class="mut">Trabalhadores</div></div></div><div class="mods" style="margin-top:16px">'+mod('📋','Permissão de Serviço Eletrônica','Salvar PDF, compartilhar, foto, assinaturas e riscos','openPse()')+mod('🔎','Inspeções de Segurança','Registros simples de campo','go(\'insps\')')+mod('🦺','Controle de EPIs','Estoque e entregas','go(\'epis\')')+mod('👷','Trabalhadores','Cadastro da equipe','go(\'workers\')')+mod('⚠️','RNC','Não conformidades','go(\'rncs\')')+mod('💬','DDS','Diálogo diário','go(\'dds\')')+'</div>'}function title(k){return{insps:'Inspeções de Segurança',epis:'Controle de EPIs',workers:'Trabalhadores',rncs:'Não Conformidades',dds:'DDS'}[k]||'Registros'}function page(k){let arr=db[k]||[];app.innerHTML='<div class="hero"><h2>'+title(k)+'</h2><p>Módulo preservado no app completo.</p></div><button class="btn" onclick="add(\''+k+'\')">Adicionar registro</button>'+(arr.length?arr.map((x,i)=>'<div class="item"><b>'+esc(x.nome)+'</b><div class="mut">'+esc(x.obs||'Registro salvo offline')+'</div><button class="btn btn2" onclick="edit(\''+k+'\','+i+')">Editar</button><button class="btn btnR" onclick="del(\''+k+'\','+i+')">Apagar</button></div>').join(''):'<div class="empty">Nenhum registro cadastrado.</div>')}function add(k){let nome=prompt('Nome/título do registro:');if(!nome)return;let obs=prompt('Observação:')||'';db[k].unshift({nome,obs});save()}function edit(k,i){let r=db[k][i],nome=prompt('Nome/título:',r.nome);if(!nome)return;r.nome=nome;r.obs=prompt('Observação:',r.obs)||'';save()}function del(k,i){if(confirm('Apagar registro?')){db[k].splice(i,1);save()}}render()</script></body></html>
