<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WorkSafePro</title><style>:root{--g:#0b6b55;--g2:#10a37f;--bg:#f4f7f6;--line:#dce8e3;--txt:#17272b;--mut:#66777d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--txt)}.top{background:linear-gradient(135deg,var(--g),var(--g2));color:white;padding:18px;text-align:center;position:sticky;top:0;z-index:10}.top h1{margin:0;font-size:24px}.top small{display:block;color:#eafff8}.main{padding:16px 16px 92px;max-width:960px;margin:auto}.hero{background:linear-gradient(135deg,#073b33,#0b6b55);color:white;border-radius:22px;padding:22px;margin-bottom:14px;box-shadow:0 8px 22px #0002}.hero h2{margin:0 0 8px}.hero p{margin:0;color:#e7fff7;line-height:1.4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.module,.item{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 18px #0001}.card strong{font-size:32px;color:var(--g)}.module{width:100%;display:grid;grid-template-columns:56px 1fr 20px;gap:12px;align-items:center;text-align:left;margin-top:12px}.ico{width:56px;height:56px;border-radius:16px;background:#e8f7f1;display:grid;place-items:center;font-size:28px}.module b{font-size:17px}.module small,.meta{display:block;color:var(--mut);font-size:14px;margin-top:4px}.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--g);color:white;font-weight:900;font-size:16px;margin-top:10px;padding:12px}.btn2{background:white;color:var(--g);border:1px solid #bddbd2}.btnR{background:#fff0f3;color:#b92d40;border:1px solid #f0c1ca}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;z-index:20}.bottom button{border:0;background:white;color:#667;min-height:54px;border-radius:14px;font-weight:900}.bottom button.on{background:#e8f7f1;color:var(--g)}input,textarea,select{width:100%;min-height:50px;border:1px solid #bdcbc5;border-radius:12px;background:white;padding:12px;font-size:16px;margin-top:6px}label{display:block;font-weight:900;color:#43545a;font-size:14px;margin-top:10px}textarea{min-height:90px}.empty{text-align:center;background:white;border:1px dashed #cbd8d3;border-radius:18px;padding:36px 12px;color:var(--mut);margin-top:12px}@media(min-width:760px){.mods{display:grid;grid-template-columns:1fr 1fr;gap:12px}.module{margin-top:0}.bottom{max-width:960px;left:50%;transform:translateX(-50%);border-radius:18px 18px 0 0}}</style></head><body><header class="top"><h1>WorkSafePro</h1><small>Segurança do Trabalho em Campo</small></header><main id="app" class="main"></main><nav class="bottom"><button id="b-home" onclick="go('home')">Início</button><button id="b-pt" onclick="openPse()">PSe</button><button id="b-insp" onclick="go('insp')">Inspeção</button><button id="b-epi" onclick="go('epi')">EPI</button></nav><script>const K='wsp-full-v1';let db=JSON.parse(localStorage.getItem(K)||'{"insps":[],"epis":[],"workers":[],"rncs":[],"dds":[]}');let cur='home';function save(){localStorage.setItem(K,JSON.stringify(db));render()}function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}function go(x){cur=x;render();scrollTo(0,0)}function openPse(){location.href='app-pse.html'}function mod(i,t,s,g){return '<button class="module" onclick="'+g+'"><div class="ico">'+i+'</div><div><b>'+t+'</b><small>'+s+'</small></div><div>›</div></button>'}function render(){['home','insp','epi'].forEach(x=>{let b=document.getElementById('b-'+x);if(b)b.classList.toggle('on',cur==x)});if(cur=='home')home();else page(cur)}function home(){app.innerHTML='<div class="hero"><h2>Central de Campo</h2><p>App completo com PSe profissional, inspeções, EPIs, trabalhadores, RNC e DDS.</p></div><div class="grid"><div class="card"><strong>PSe</strong><span>Permissão profissional</span></div><div class="card"><strong>'+db.insps.length+'</strong><span>Inspeções</span></div><div class="card"><strong>'+db.epis.length+'</strong><span>EPIs</span></div><div class="card"><strong>'+db.workers.length+'</strong><span>Trabalhadores</span></div></div><div class="mods" style="margin-top:16px">'+mod('📋','Permissão de Serviço Eletrônica','Modelo profissional com checklist, foto, assinaturas e PDF','openPse()')+mod('🔎','Inspeções de Segurança','Registros simples de campo','go(\'insp\')')+mod('🦺','Controle de EPIs','Estoque e entregas','go(\'epi\')')+mod('👷','Trabalhadores','Cadastro da equipe','go(\'workers\')')+mod('⚠️','RNC','Não conformidades','go(\'rncs\')')+mod('💬','DDS','Diálogo diário','go(\'dds\')')+'</div>'}function title(k){return{insp:'Inspeções de Segurança',epi:'Controle de EPIs',workers:'Trabalhadores',rncs:'Não Conformidades',dds:'DDS'}[k]||'Registros'}function page(k){let arr=db[k]||[];app.innerHTML='<div class="hero"><h2>'+title(k)+'</h2><p>Módulo preservado no app completo. A PSe profissional fica no botão PSe.</p></div><button class="btn" onclick="add(\''+k+'\')">Adicionar registro</button>'+(arr.length?arr.map((x,i)=>'<div class="item"><b>'+esc(x.nome)+'</b><div class="meta">'+esc(x.obs||'Registro salvo offline')+'</div><button class="btn btn2" onclick="edit(\''+k+'\','+i+')">Editar</button><button class="btn btnR" onclick="del(\''+k+'\','+i+')">Apagar</button></div>').join(''):'<div class="empty">Nenhum registro cadastrado.</div>')}function add(k){let nome=prompt('Nome/título do registro:');if(!nome)return;let obs=prompt('Observação:')||'';db[k].unshift({nome,obs});save()}function edit(k,i){let r=db[k][i];let nome=prompt('Nome/título:',r.nome);if(!nome)return;r.nome=nome;r.obs=prompt('Observação:',r.obs)||'';save()}function del(k,i){if(confirm('Apagar registro?')){db[k].splice(i,1);save()}}render()</script></body></html>
