<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WorkSafePro</title><style>body{margin:0;background:#f4f7f6;font-family:Arial,sans-serif;color:#17272b}.top{background:linear-gradient(135deg,#0b6b55,#10a37f);color:white;padding:18px;text-align:center;position:sticky;top:0}.top h1{margin:0}.main{padding:16px 16px 92px;max-width:960px;margin:auto}.hero{background:linear-gradient(135deg,#073b33,#0b6b55);color:white;border-radius:22px;padding:22px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.module,.item{background:white;border:1px solid #dce8e3;border-radius:18px;padding:16px;box-shadow:0 8px 18px #0001}.module{width:100%;display:grid;grid-template-columns:56px 1fr 20px;gap:12px;align-items:center;text-align:left;margin-top:12px}.ico{width:56px;height:56px;border-radius:16px;background:#e8f7f1;display:grid;place-items:center;font-size:28px}.mut{color:#66777d;font-size:14px}.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:#0b6b55;color:white;font-weight:900;font-size:16px;margin-top:10px}.btn2{background:white;color:#0b6b55;border:1px solid #bddbd2}.btnR{background:#fff0f3;color:#b92d40;border:1px solid #f0c1ca}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce8e3;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}.bottom button{border:0;background:white;color:#667;min-height:54px;border-radius:14px;font-weight:900}.empty{text-align:center;background:white;border:1px dashed #cbd8d3;border-radius:18px;padding:36px 12px;color:#667;margin-top:12px}@media(min-width:760px){.mods{display:grid;grid-template-columns:1fr 1fr;gap:12px}.module{margin-top:0}}</style></head><body><header class="top"><h1>WorkSafePro</h1><small>Segurança do Trabalho em Campo</small></header><main id="app" class="main"></main><nav class="bottom"><button onclick="go('home')">Início</button><button onclick="openPse()">PSe</button><button onclick="go('insp')">Inspeção</button><button onclick="go('epi')">EPI</button></nav><script>const K='wsp-full2';let db=JSON.parse(localStorage.getItem(K)||'{"insps":[],"epis":[],"workers":[],"rncs":[],"dds":[]}'),cur='home';function save(){localStorage.setItem(K,JSON.stringify(db));render()}function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}function go(x){cur=x;render();scrollTo(0,0)}function openPse(){location.href='app-pse2.html'}function mod(i,t,s,g){return '<button class="module" onclick="'+g+'"><div class="ico">'+i+'</div><div><b>'+t+'</b><div class="mut">'+s+'</div></div><div>›</div></button>'}function render(){if(cur=='home')home();else page(cur)}function home(){app.innerHTML='<div class="hero"><h2>Central de Campo</h2><p>App completo com PSe profissional, inspeções, EPIs, trabalhadores, RNC e DDS.</p></div><div class="grid"><div class="card"><b>PSe</b><div class="mut">Permissão profissional</div></div><div class="card"><b>'+db.insps.length+'</b><div class="mut">Inspeções</div></div><div class="card"><b>'+db.epis.length+'</b><div class="mut">EPIs</div></div><div class="card"><b>'+db.workers.length+'</b><div class="mut">Trabalhadores</div></div></div><div class="mods" style="margin-top:16px">'+mod('📋','Permissão de Serviço Eletrônica','Modelo atualizado com foto, riscos extras e PDF','openPse()')+mod('🔎','Inspeções de Segurança','Registros simples de campo','go(\'insps\')')+mod('🦺','Controle de EPIs','Estoque e entregas','go(\'epis\')')+mod('👷','Trabalhadores','Cadastro da equipe','go(\'workers\')')+mod('⚠️','RNC','Não conformidades','go(\'rncs\')')+mod('💬','DDS','Diálogo diário','go(\'dds\')')+'</div>'}function title(k){return{insps:'Inspeções de Segurança',epis:'Controle de EPIs',workers:'Trabalhadores',rncs:'Não Conformidades',dds:'DDS'}[k]||'Registros'}function page(k){let arr=db[k]||[];app.innerHTML='<div class="hero"><h2>'+title(k)+'</h2><p>Módulo preservado no app completo.</p></div><button class="btn" onclick="add(\''+k+'\')">Adicionar registro</button>'+(arr.length?arr.map((x,i)=>'<div class="item"><b>'+esc(x.nome)+'</b><div class="mut">'+esc(x.obs||'Registro salvo offline')+'</div><button class="btn btn2" onclick="edit(\''+k+'\','+i+')">Editar</button><button class="btn btnR" onclick="del(\''+k+'\','+i+')">Apagar</button></div>').join(''):'<div class="empty">Nenhum registro cadastrado.</div>')}function add(k){let nome=prompt('Nome/título do registro:');if(!nome)return;let obs=prompt('Observação:')||'';db[k].unshift({nome,obs});save()}function edit(k,i){let r=db[k][i],nome=prompt('Nome/título:',r.nome);if(!nome)return;r.nome=nome;r.obs=prompt('Observação:',r.obs)||'';save()}function del(k,i){if(confirm('Apagar registro?')){db[k].splice(i,1);save()}}render()</script></body></html>
