<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WorkSafePro PSe</title><style>:root{--g:#0b6b55;--g2:#13a37f;--p:#6f2477;--bg:#f4f7f6;--card:#fff;--line:#d8e2de;--txt:#1d2b30;--mut:#66777d;--red:#bc2f43}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--txt)}.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--g),var(--g2));color:white;padding:16px;text-align:center;box-shadow:0 5px 20px #0002}.top h1{margin:0;font-size:24px}.top small{display:block;margin-top:3px;color:#e7fff8}.main{padding:14px 14px 92px;max-width:980px;margin:auto}.hero{background:linear-gradient(135deg,#073b33,#0b6b55);color:white;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 10px 24px #0002}.hero h2{margin:0 0 8px;font-size:25px}.hero p{margin:0;color:#e2fff7;line-height:1.4}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:sticky;top:78px;background:var(--bg);padding:8px 0;z-index:9}.tabs button{border:1px solid var(--line);background:white;color:var(--mut);border-radius:14px;min-height:46px;font-weight:800}.tabs button.on{background:#e7f6f1;color:var(--g);border-color:#b8dcd0}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 8px 18px #0001}.sec{background:var(--p);color:white;border-radius:10px;padding:10px 12px;font-weight:900;margin:16px 0 10px}.subsec{font-size:18px;font-weight:900;margin:14px 0 8px;border-left:5px solid var(--g);padding-left:10px}label{display:block;font-size:13px;font-weight:900;color:#45555b;margin-top:10px}input,select,textarea{width:100%;min-height:50px;border:1px solid #bcc9c5;border-radius:12px;background:#fff;padding:12px;font-size:16px;margin-top:6px;color:var(--txt)}textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10 ound:white;touch-action:none}.sigBar{display:flex;justify-content:space-between;align-items:center;background:#edf7f4;padding:8px}.person{border:1px solid var(--line);border-radius:16px;background:#fbfdfc;padding:12px;margin-top:10px}.empty{text-align:center;background:white;border:1px dashed #cbd8d3;border-radius:18px;padding:38px 12px;color:var(--mut);margin-top:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;z-index:11}.bottom button{border:0;background:white;border-radius:14px;min-height:54px;color:#667;font-weight:900}.bottom button.on{background:#e8f7f1;color:var(--g)}@media(min-width:760px){.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bottom{left:50%;transform:translateX(-50%);max-width:980px;border-radius:18px 18px 0 0}.main{padding-bottom:100px}}@media print{body{background:white}.top,.tabs,.bottom,.noPrint{display:none!important}.main{padding:0;max-width:none}.print{display:block!important}.screen{display:none!important}}.print{display:none}</style></head><body><header class="top"><h1>WorkSafePro</h1><small>Permissão de Serviço Eletrônica - PSe</small></header><main id="app" class="main"></main><nav class="bottom"><button id="nav-home" onclick="go('home')">Início</button><button id="nav-new" onclick="newPse()">Nova PSe</button><button id="nav-list" onclick="go('list')">Histórico</button></nav><script>const K='wsp-pse-prof-v1';let db=JSON.parse(localStorage.getItem(K)||'{"pses":[]}');let screen='home';let editIndex=null;const geral=['Local do serviço está desobstruído, possui boa visibilidade e acesso adequado para realização do serviço?','Local do serviço foi isolado e sinalizado?','Realizada análise dos riscos gerados e comunicação entre equipes atuando no local do serviço?','Se identificado riscos, foram suspensas atividades/operações que impeçam a realização com segurança?','Os executores estão aptos pela medicina para realização do serviço?','Todas as medidas de controle de riscos recomendadas estão disponíveis e em perfeitas condições?','Todos os equipamentos/ferramentas necessários estão disponíveis e em perfeitas condições?','Realizado isolamento e/ou bloqueio de energias perigosas?'];const riscos=[['Projeção de Partículas',['Óculos ampla visão','Óculos de segurança','Protetor facial','NA']],['Agentes Biológicos',['Luvas impermeáveis','Proteção respiratória','Conjunto impermeável','Bota PVC','Óculos de segurança','NA']],['Altas Temperaturas',['Conjunto anti-chamas','Luvas proteção térmica','Balaclava','Avental térmico','Vestimenta alta temperatura','NA']],['Asfixia / Intoxicação',['Conjunto autônomo AR','Ar mandado','Exaustor/insuflador','NA']],['Atropelamento',['Uniforme refletivo','Sinalização de área','Isolamento de área','Caminho seguro','NA']],['Choque / Arco elétrico',['Vestimenta FR','Luva isolante','Protetor facial arco elétrico','Ferramenta isolante','Aterramento','Disjuntor DR','NA']],['Colisão',['Sinalização de área','Isolamento de área','Iluminação artificial','NA']],['Derrame / Vazamento',['Controle de nível','Bacia de contenção','Kit emergência ambiental','Drenagem','NA']],['Desmoronamento',['Escoras','Sinalização de área','Isolamento de área','Chanfrar talude','NA']],['Ergonômicos',['Revezamento','Pausas','Orientação de postura correta','NA']],['Exposição no raio de fogo da peça',['Bastão de segurança','Corda guia','Isolamento de área','Sinalização de área','NA']],['Fumos Metálicos',['Proteção respiratória','Sistema de exaustão','Biombo','NA']],['Incêndio / Explosão',['Extintor','Rede de hidrantes','Monitoramento de gases','Molhar área','Caminhão pipa','NA']],['Perfuração / Corte',['Ferramenta extensora','Luva proteção mecânica','NA']],['Prensagem',['Ferramenta extensora','Mãos afastadas','Luva proteção mecânica','Luva de raspa','NA']],['Produtos Químicos',['Proteção respiratória','Vestimenta impermeável','Luvas impermeáveis','Óculos ampla visão','Bota PVC','Protetor facial','Chuveiro/lava-olhos','NA']],['Queda de Objetos',['Sinalização/isolamento','Calçado com biqueira','Capacete com jugular','NA']],['Queda de Pessoas',['Linha de vida','Barreira física','Trava-quedas retrátil','Ancoragem','Cinto/talabarte','Inspecionar escadas/plataformas','Caminho seguro','Isolar área','NA']],['Queimadura',['Luva térmica','Avental raspa','Mangote raspa','Protetor facial','Biombo','Balaclava','Vestimenta FR','Luva raspa','NA']],['Ruído',['Protetor auditivo tipo plug','Protetor auditivo tipo concha','NA']],['Tombamento',['Patolagem','Controle de velocidade','NA']]];function base(){return{modelo:'PS-e (Gerais ou Governança não Críticos)',id:'PSE-'+Date.now().toString().slice(-8),auth:Math.floor(1000+Math.random()*9000)+'-'+new Date().toLocaleDateString('pt-BR'),manut:'',empresa:'',inicio:new Date().toISOString().slice(0,16),fim:'',autenticador:'',apr:'',tipoAtividade:'Não Programada',condicao:'Iniciada',area:'',setor:'',subsetor:'',gestor:'',local:'',descricao:'',executantesEmp:'',om:'',ast:'N/A',modeloApr:'Não foi selecionado modelo',modeloPse:'Modelo de PSe: PS-e (Gerais ou Governança não Críticos)',obs:'',episBasicos:'Uniforme refletivo, Capacete de Segurança com Jugular, Protetor Auditivo, Óculos de Segurança e Calçado de Segurança com proteção na Biqueira.',epcs:'',ferramentas:'Ferramentas Manuais; Máquinas e Equipamentos',substancias:'--',emergencia:{ponto:'',telefone:'1193',ambulancia:'',radio:''},geral:geral.map(q=>({q,resp:''})),riscos:riscos.map(r=>({nome:r[0],controls:r[1].map(c=>({c,on:false}))})),declaracao:'Compreendi todas as medidas de prevenção de acidentes, confirmo que estas serão adotadas e comprometo-me a realizar a Auto Avaliação de Segurança - AAS, antes, durante e depois de qualquer atividade.',emissor:{nome:'',funcao:'',mat:'',sig:'',dt:''},lider:{nome:'',funcao:'',mat:'',sig:'',dt:''},trabs:[],evidencia:'',status:'Iniciada'}}function save(){localStorage.setItem(K,JSON.stringify(db))}function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}function go(s){screen=s;editIndex=null;render();scrollTo(0,0)}function newPse(){editIndex=null;screen='form';window.current=base();render()}function editPse(i){editIndex=i;screen='form';window.current=JSON.parse(JSON.stringify(db.pses[i]));render()}function render(){['home','new','list'].forEach(n=>{let b=document.getElementById('nav-'+n);if(b)b.classList.toggle('on',(n=='home'&&screen=='home')||(n=='list'&&screen=='list'))});if(screen=='home')home();else if(screen=='list')list();else form()}function home(){app.innerHTML='<div class="hero"><h2>Permissão de Serviço Eletrônica</h2><p>Modelo profissional com informações gerais, lista de verificação, controle de riscos, assinatura dos envolvidos e PDF final.</p></div><div class="grid2"><div class="panel"><b>Total de PSe</b><h2>'+db.pses.length+'</h2><p class="meta">Registros salvos offline neste aparelho.</p></div><div class="panel"><b>Próximo passo</b><p class="meta">Crie uma PSe, marque os itens com tik e gere o PDF final.</p><button class="btn" onclick="newPse()">Nova PSe profissional</button></div></div><div class="panel"><div class="sec">Estrutura do documento</div><p class="meta">1. Informações Gerais<br>2. Atenção e revalidação<br>3. EPIs básicos<br>4. Lista Geral de Verificação<br>5. Identificação e Controle de Riscos / Medidas Mitigadoras<br>6. Emergência<br>7. Declaração e assinaturas<br>8. Evidência Fotográfica</p></div>'}function list(){app.innerHTML='<div class="hero"><h2>Histórico de PSe</h2><p>Edite, apague ou gere PDF dos documentos salvos.</p></div>'+(db.pses.length?db.pses.map((p,i)=>'<div class="record"><b>'+esc(p.modelo)+'</b><div class="meta">ID: '+esc(p.id)+' | '+esc(p.empresa)+'<br>Local: '+esc(p.local)+' | Condição: '+esc(p.condicao)+'</div><span class="badge">'+esc(p.status)+'</span><button class="btn btn2" onclick="editPse('+i+')">Editar</button><button class="btn" onclick="printPse('+i+')">Gerar PDF</button><button class="btn btnR" onclick="delPse('+i+')">Apagar</button></div>').join(''):'<div class="empty">Nenhuma PSe cadastrada.</div>')}function tabs(){return '<div class="tabs"><button onclick="jump(\'info\')">Dados</button><button onclick="jump(\'check\')">Checks</button><button onclick="jump(\'risk\')">Riscos</button><button onclick="jump(\'sign\')">Assin.</button></div>'}function form(){let p=window.current||base();app.innerHTML='<div class="hero"><h2>'+ (editIndex!=null?'Editar':'Nova') +' PSe Profissional</h2><p>Preencha, marque com tik, colete assinaturas e gere PDF.</p></div>'+tabs()+'<div class="panel" id="info"><div class="sec">1. Informações Gerais</div>'+inp('Empresa / Planta','empresa',p.empresa)+row(inp('Data / Hora Início','inicio',p.inicio,'datetime-local')+inp('Data / Hora Fim','fim',p.fim,'datetime-local'))+row(inp('Autenticador','autenticador',p.autenticador)+inp('ID da APR/AST vinculada','apr',p.apr))+row(sel('Tipo da Atividade','tipoAtividade',p.tipoAtividade,['Programada','Não Programada','Emergencial'])+sel('Condição da PSe','condicao',p.condicao,['Iniciada','Revalidada','Suspensa','Encerrada']))+row(inp('Área','area',p.area)+inp('Setor','setor',p.setor))+row(inp('Subsetor','subsetor',p.subsetor)+inp('Responsável da área gestora','gestor',p.gestor))+inp('Local da atividade','local',p.local)+txt('Descrição detalhada da atividade','descricao',p.descricao)+inp('Empresas executantes','executantesEmp',p.executantesEmp)+row(inp('Nº Ordem de Manutenção','om',p.om)+inp('Número da AST','ast',p.ast))+txt('Observações','obs',p.obs)+row(inp('EPIs','episBasicos',p.episBasicos)+inp('Ferramentas / Equipamentos','ferramentas',p.ferramentas))+row(inp('EPCs','epcs',p.epcs)+inp('Substâncias / Produtos','substancias',p.substancias))+'</div><div class="panel"><div class="sec">2. Atenção</div><p class="meta"><b>Uma emergência, abandono de área ou mudança nas condições de trabalho que requeira alteração das medidas de controle inicialmente previstas suspende esta permissão.</b></p><p class="meta">Em caso de revalidação, manter mínimo de 50% da equipe inicial.</p></div><div class="panel" id="check"><div class="sec">6. Lista Geral de Verificação</div>'+checkTable(p.geral)+'</div><div class="panel"><div class="sec">Emergência</div>'+row(inpE('Ponto de encontro mais próximo','ponto',p.emergencia.ponto)+inpE('Telefone emergência','telefone',p.emergencia.telefone))+row(inpE('Parada de ambulância mais próxima','ambulancia',p.emergencia.ambulancia)+inpE('Canal do rádio','radio',p.emergencia.radio))+'</div><div class="panel" id="risk"><div class="sec">7. Identificação e Controle de Riscos / Medidas Mitigadoras</div><p class="meta">Marque/tique somente as medidas aplicáveis ou NA.</p>'+riskBlocks(p.riscos)+'</div><div class="panel" id="sign"><div class="sec">10. Declaração de Envolvidos</div>'+txt('Declaração','declaracao',p.declaracao)+'<div class="subsec">11. Emissor</div>'+person('emissor',p.emissor)+'<div class="subsec">12. Executor Líder</div>'+person('lider',p.lider)+'<div class="subsec">13. Trabalhadores Envolvidos</div><div id="trabs">'+p.trabs.map((t,i)=>person('trab'+i,t,true)).join('')+'</div><button class="btn btn2" onclick="addTrab()">+ Adicionar trabalhador</button><div class="subsec">14. Evidência Fotográfica</div>'+txt('Descrição / referência da evidência','evidencia',p.evidencia)+'<button class="btn" onclick="savePse()">Salvar PSe</button><button class="btn btn2" onclick="previewPdf()">Gerar PDF</button></div>';setupSigs()}function row(x){return '<div class="row">'+x+'</div>'}function inp(l,k,v,type='text'){return '<label>'+l+'<input id="'+k+'" type="'+type+'" value="'+esc(v)+'"></label>'}function inpE(l,k,v){return '<label>'+l+'<input id="em_'+k+'" value="'+esc(v)+'"></label>'}function txt(l,k,v){return '<label>'+l+'<textarea id="'+k+'">'+esc(v)+'</textarea></label>'}function sel(l,k,v,ops){return '<label>'+l+'<select id="'+k+'">'+ops.map(o=>'<option '+(o==v?'selected':'')+'>'+o+'</option>').join('')+'</select></label>'}function checkTable(items){return '<table class="checkTable">'+items.map((it,i)=>'<tr><td>'+esc(it.q)+'</td><td>'+tik('g'+i,'S',it.resp)+'</td><td>'+tik('g'+i,'N',it.resp)+'</td><td>'+tik('g'+i,'NA',it.resp)+'</td></tr>').join('')+'</table>'}function tik(name,val,cur){return '<label class="tik"><input type="radio" name="'+name+'" value="'+val+'" '+(cur==val?'checked':'')+'> '+val+'</label>'}function riskBlocks(rs){return rs.map((r,i)=>'<div class="risk"><div class="riskHead"><b>'+esc(r.nome)+'</b><span class="badge">CHECKLIST</span></div><div class="controlGrid">'+r.controls.map((c,j)=>'<label class="chip"><input type="checkbox" id="r_'+i+'_'+j+'" '+(c.on?'checked':'')+'> '+esc(c.c)+'</label>').join('')+'</div></div>').join('')}function person(prefix,p,rem){return '<div class="person"><label>Nome<input id="'+prefix+'_nome" value="'+esc(p.nome||'')+'"></label>'+row(inpP(prefix,'Função','funcao',p.funcao)+inpP(prefix,'Matrícula','mat',p.mat))+'<label>Assinatura</label>'+sig(prefix+'_sig')+(rem?'<button class="btn btnR" onclick="this.closest(\'.person\').remove()">Remover trabalhador</button>':'')+'</div>'}function inpP(pr,l,k,v){return '<label>'+l+'<input id="'+pr+'_'+k+'" value="'+esc(v||'')+'"></label>'}function sig(id){return '<div class="sig" data-sig="'+id+'"><canvas></canvas><div class="sigBar"><span class="meta">Assine com o dedo</span><button type="button" class="btn btn2" style="width:auto;margin:0;min-height:40px" onclick="clearSig(this)">Limpar</button></div></div>'}function setupSigs(){document.querySelectorAll('.sig').forEach(box=>{if(box.ok)return;box.ok=1;let c=box.querySelector('canvas'),ctx=c.getContext('2d'),down=false,last=null;function size(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1,old=c.toDataURL();c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.strokeStyle='#263ccf';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round'}function pos(e){let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}function start(e){e.preventDefault();if(!c.width)size();down=true;last=pos(e)}function move(e){if(!down)return;e.preventDefault();let p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}function end(){down=false}setTimeout(size,80);c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',end);c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);window.addEventListener('mouseup',end)})}function getSig(id){let b=document.querySelector('[data-sig="'+id+'"]');return b&&b.querySelector('canvas').width?b.querySelector('canvas').toDataURL('image/png'):''}function clearSig(btn){let c=btn.closest('.sig').querySelector('canvas');c.getContext('2d').clearRect(0,0,c.width,c.height)}function jump(id){document.getElementById(id).scrollIntoView({behavior:'smooth'})}function addTrab(){let n=document.querySelectorAll('#trabs .person').length;document.getElementById('trabs').insertAdjacentHTML('beforeend',person('trab'+n,{nome:'',funcao:'',mat:'',sig:''},true));setupSigs()}function collect(){let p=window.current||base();['modelo','id','auth'].forEach(k=>p[k]=p[k]||base()[k]);['empresa','inicio','fim','autenticador','apr','tipoAtividade','condicao','area','setor','subsetor','gestor','local','descricao','executantesEmp','om','ast','obs','episBasicos','epcs','ferramentas','substancias','declaracao','evidencia'].forEach(k=>p[k]=document.getElementById(k)?.value||'');p.emergencia={ponto:em_ponto.value,telefone:em_telefone.value,ambulancia:em_ambulancia.value,radio:em_radio.value};p.geral=geral.map((q,i)=>({q,resp:(document.querySelector('input[name="g'+i+'"]:checked')||{}).value||''}));p.riscos=p.riscos.map((r,i)=>({nome:r.nome,controls:r.controls.map((c,j)=>({c:c.c,on:document.getElementById('r_'+i+'_'+j)?.checked||false}))}));p.emissor=readPerson('emissor');p.lider=readPerson('lider');p.trabs=[...document.querySelectorAll('#
