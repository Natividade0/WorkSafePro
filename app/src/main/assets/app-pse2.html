<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WorkSafePro PSe</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f6;font-family:Arial,sans-serif;color:#1d2b30}.top{background:linear-gradient(135deg,#0b6b55,#13a37f);color:white;padding:16px;text-align:center;position:sticky;top:0;z-index:10}.top h1{margin:0}.main{padding:14px 14px 90px;max-width:900px;margin:auto}.hero{background:linear-gradient(135deg,#073b33,#0b6b55);color:white;border-radius:22px;padding:20px;margin-bottom:12px}.panel,.record{background:white;border:1px solid #d8e2de;border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 8px 18px #0001}.sec{background:#6f2477;color:white;border-radius:10px;padding:10px;font-weight:900;margin:14px 0 10px}.sub{font-size:18px;font-weight:900;border-left:5px solid #0b6b55;padding-left:10px;margin-top:14px}label{display:block;font-size:13px;font-weight:900;color:#45555b;margin-top:10px}input,select,textarea{width:100%;min-height:50px;border:1px solid #bcc9c5;border-radius:12px;padding:12px;font-size:16px;margin-top:6px}textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;min-height:52px;border:0;border-radius:14px;padding:12px;background:#0b6b55;color:white;font-weight:900;font-size:16px;margin-top:10px}.btn2{background:white;color:#0b6b55;border:1px solid #bddbd2}.btnR{background:#fff0f3;color:#bc2f43;border:1px solid #f0c1ca}.mut{color:#66777d}.tik{display:inline-flex;justify-content:center;align-items:center;min-width:54px;min-height:42px;border:1px solid #cfdad6;border-radius:11px;background:white;font-weight:900;margin:2px}.tik input{display:none}.tik:has(input:checked){background:#e8f7f1;color:#0b6b55;border-color:#0b6b55}.check td{background:#f9fbfa;border-top:1px solid #d8e2de;border-bottom:1px solid #d8e2de;padding:8px;font-size:14px}.check{width:100%;border-spacing:0 8px}.risk{border:1px solid #d8e2de;border-radius:16px;background:#fbfdfc;padding:12px;margin-top:10px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #cfdad6;background:white;border-radius:999px;padding:9px 11px;font-weight:800;font-size:13px}.chip input{width:18px;height:18px;min-height:auto;margin:0}.sig{border:1px solid #0b6b55;border-radius:14px;overflow:hidden;margin-top:8px}.sig canvas{display:block;width:100%;height:160px;background:white;touch-action:none}.sigbar{display:flex;justify-content:space-between;align-items:center;background:#edf7f4;padding:8px}.person{border:1px solid #d8e2de;border-radius:16px;background:#fbfdfc;padding:12px;margin-top:10px}.photo{border:1px dashed #b8c9c2;border-radius:16px;min-height:160px;background:#fbfdfc;display:grid;place-items:center;overflow:hidden;text-align:center;color:#66777d;margin-top:10px}.photo img{max-width:100%;max-height:280px}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #d8e2de;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}.bottom button{border:0;background:white;border-radius:14px;min-height:54px;color:#667;font-weight:900}.bottom button.on{background:#e8f7f1;color:#0b6b55}@media(min-width:760px){.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bottom{max-width:900px;left:50%;transform:translateX(-50%);border-radius:18px 18px 0 0}}</style></head><body><header class="top"><h1>WorkSafePro</h1><small>PSe Profissional</small></header><main id="app" class="main"></main><nav class="bottom"><button onclick="go('home')">Início</button><button onclick="novo()">Nova PSe</button><button onclick="go('list')">Histórico</button></nav><script>const K='wsp-pse-v3';let db=JSON.parse(localStorage.getItem(K)||'{"pses":[]}'),tela='home',edit=null,current=null;const geral=['Local desobstruído, com boa visibilidade e acesso adequado?','Local isolado e sinalizado?','Riscos comunicados às equipes no local?','Atividades conflitantes foram suspensas?','Executores aptos para o serviço?','Medidas de controle disponíveis e em boas condições?','Equipamentos/ferramentas em boas condições?','Bloqueio/isolamento de energias perigosas realizado?'];const baseR=[['Projeção de partículas',['Óculos ampla visão','Óculos de segurança','Protetor facial','NA']],['Choque / arco elétrico',['Vestimenta FR','Luva isolante','Ferramenta isolante','Aterramento','DR','NA']],['Incêndio / explosão',['Extintor','Hidrante','Monitoramento de gases','Molhar área','NA']],['Queda de pessoas',['Linha de vida','Trava-quedas','Cinto/talabarte','Ancoragem','Isolamento de área','NA']],['Queda de objetos',['Sinalização','Isolamento','Capacete com jugular','NA']],['Prensagem / corte',['Ferramenta extensora','Mãos afastadas','Luva mecânica','NA']],['Produtos químicos',['Respirador','Luvas impermeáveis','Óculos ampla visão','Bota PVC','Chuveiro/lava-olhos','NA']],['Ruído',['Protetor auditivo plug','Protetor auditivo concha','NA']]];function base(){return{id:'PSE-'+Date.now().toString().slice(-8),auth:Math.floor(1000+Math.random()*9000)+'-'+new Date().toLocaleDateString('pt-BR'),empresa:'',inicio:new Date().toISOString().slice(0,16),fim:'',autenticador:'',tipo:'Não Programada',condicao:'Iniciada',area:'',setor:'',local:'',descricao:'',executantesEmp:'',obs:'',emerg:{ponto:'',tel:'1193',amb:'',radio:''},geral:geral.map(q=>({q,resp:''})),riscos:baseR.map(r=>({nome:r[0],controls:r[1].map(c=>({c,on:false}))})),decl:'Compreendi todas as medidas de prevenção de acidentes e confirmo que estas serão adotadas antes, durante e depois da atividade.',emissor:{},lider:{},trabs:[],evidencia:'',foto:'',status:'Iniciada'}}function save(){localStorage.setItem(K,JSON.stringify(db))}function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}function go(x){tela=x;edit=null;render();scrollTo(0,0)}function novo(){edit=null;current=base();tela='form';render()}function editar(i){edit=i;current=JSON.parse(JSON.stringify(db.pses[i]));tela='form';render()}function render(){if(tela=='home')home();else if(tela=='list')lista();else form()}function home(){app.innerHTML='<div class="hero"><h2>Permissão de Serviço Eletrônica</h2><p>Modelo profissional com checklist, riscos editáveis, foto, assinaturas e PDF.</p></div><div class="panel"><h2>'+db.pses.length+'</h2><b>PSe salvas offline</b><button class="btn" onclick="novo()">Nova PSe</button></div>'}function lista(){app.innerHTML='<div class="hero"><h2>Histórico de PSe</h2><p>Editar, apagar ou gerar PDF.</p></div>'+(db.pses.length?db.pses.map((p,i)=>'<div class="record"><b>'+esc(p.id)+' - '+esc(p.empresa)+'</b><div class="mut">'+esc(p.local)+' | '+esc(p.condicao)+'</div><button class="btn btn2" onclick="editar('+i+')">Editar</button><button class="btn" onclick="pdf('+i+')">Gerar PDF</button><button class="btn btnR" onclick="del('+i+')">Apagar</button></div>').join(''):'<div class="panel mut">Nenhuma PSe salva.</div>')}function form(){let p=current||base();app.innerHTML='<div class="hero"><h2>'+(edit!=null?'Editar':'Nova')+' PSe</h2><p>Informações gerais simplificadas.</p></div><div class="panel"><div class="sec">1. Informações Gerais</div>'+inp('Empresa / Planta','empresa',p.empresa)+row(inp('Data / Hora Início','inicio',p.inicio,'datetime-local')+inp('Data / Hora Fim','fim',p.fim,'datetime-local'))+row(inp('Autenticador','autenticador',p.autenticador)+sel('Tipo da Atividade','tipo',p.tipo,['Programada','Não Programada','Emergencial']))+row(sel('Condição da PSe','condicao',p.condicao,['Iniciada','Revalidada','Suspensa','Encerrada'])+inp('Área','area',p.area))+row(inp('Setor','setor',p.setor)+inp('Local da atividade','local',p.local))+txt('Descrição detalhada da atividade','descricao',p.descricao)+inp('Empresas executantes','executantesEmp',p.executantesEmp)+txt('Observações','obs',p.obs)+'</div><div class="panel"><div class="sec">2. Atenção</div><p><b>Emergência, abandono de área ou mudança nas condições de trabalho suspende esta permissão.</b></p></div><div class="panel"><div class="sec">6. Lista Geral de Verificação</div>'+checkTable(p.geral)+'</div><div class="panel"><div class="sec">Emergência</div>'+row(inpe('Ponto de encontro','ponto',p.emerg.ponto)+inpe('Telefone emergência','tel',p.emerg.tel))+row(inpe('Parada de ambulância','amb',p.emerg.amb)+inpe('Canal do rádio','radio',p.emerg.radio))+'</div><div class="panel"><div class="sec">7. Identificação e Controle de Riscos / Medidas Mitigadoras</div><p class="mut">Marque as medidas aplicáveis. Você também pode adicionar novos riscos.</p><div id="riskBox">'+riskBlocks(p.riscos)+'</div><button class="btn btn2" onclick="addRisk()">+ Adicionar risco</button></div><div class="panel"><div class="sec">10. Declaração e Assinaturas</div>'+txt('Declaração','decl',p.decl)+'<div class="sub">Emissor</div>'+person('emissor',p.emissor)+'<div class="sub">Executor Líder</div>'+person('lider',p.lider)+'<div class="sub">Trabalhadores Envolvidos</div><div id="trabs">'+p.trabs.map((t,i)=>person('trab'+i,t,true)).join('')+'</div><button class="btn btn2" onclick="addTrab()">+ Adicionar trabalhador</button><div class="sub">14. Evidência Fotográfica</div>'+txt('Descrição da evidência','evidencia',p.evidencia)+'<input id="cam" type="file" accept="image/*" capture="environment" style="display:none" onchange="loadPhoto(this)"><input id="gal" type="file" accept="image/*" style="display:none" onchange="loadPhoto(this)"><div class="row"><button class="btn" onclick="cam.click()">Tirar foto</button><button class="btn btn2" onclick="gal.click()">Galeria</button></div><div class="photo" id="photoBox">'+(p.foto?'<img src="'+p.foto+'">':'Nenhuma foto adicionada')+'</div><button class="btn btnR" onclick="clearPhoto()">Remover foto</button><button class="btn" onclick="salvar()">Salvar PSe</button><button class="btn btn2" onclick="gerar()">Gerar PDF</button></div>';setupSigs()}function row(x){return '<div class="row">'+x+'</div>'}function inp(l,k,v,t='text'){return '<label>'+l+'<input id="'+k+'" type="'+t+'" value="'+esc(v)+'"></label>'}function inpe(l,k,v){return '<label>'+l+'<input id="em_'+k+'" value="'+esc(v)+'"></label>'}function txt(l,k,v){return '<label>'+l+'<textarea id="'+k+'">'+esc(v)+'</textarea></label>'}function sel(l,k,v,ops){return '<label>'+l+'<select id="'+k+'">'+ops.map(o=>'<option '+(o==v?'selected':'')+'>'+o+'</option>').join('')+'</select></label>'}function tik(n,v,c){return '<label class="tik"><input type="radio" name="'+n+'" value="'+v+'" '+(c==v?'checked':'')+'> '+v+'</label>'}function checkTable(items){return '<table class="check">'+items.map((it,i)=>'<tr><td>'+esc(it.q)+'</td><td>'+tik('g'+i,'S',it.resp)+'</td><td>'+tik('g'+i,'N',it.resp)+'</td><td>'+tik('g'+i,'NA',it.resp)+'</td></tr>').join('')+'</table>'}function riskBlocks(rs){return rs.map(r=>'<div class="risk"><b>'+esc(r.nome)+'</b><button class="btn btnR" onclick="this.closest(\'.risk\').remove()">Apagar risco</button><div class="chips">'+r.controls.map(c=>'<label class="chip"><input type="checkbox" '+(c.on?'checked':'')+'> '+esc(c.c)+'</label>').join('')+'</div><button class="btn btn2" onclick="addControl(this)">+ Medida</button></div>').join('')}function addRisk(){let nome=prompt('Nome do risco:');if(!nome)return;let med=(prompt('Medidas separadas por vírgula:')||'NA').split(',').map(x=>x.trim()).filter(Boolean);riskBox.insertAdjacentHTML('beforeend',riskBlocks([{nome,controls:med.map(c=>({c,on:false}))}]))}function addControl(b){let m=prompt('Nova medida de controle:');if(!m)return;b.previousElementSibling.insertAdjacentHTML('beforeend','<label class="chip"><input type="checkbox"> '+esc(m)+'</label>')}function person(pr,p={},rem){return '<div class="person"><label>Nome<input id="'+pr+'_nome" value="'+esc(p.nome||'')+'"></label>'+row(inpP(pr,'Função','funcao',p.funcao)+inpP(pr,'Matrícula','mat',p.mat))+'<label>Assinatura</label>'+sig(pr+'_sig')+(rem?'<button class="btn btnR" onclick="this.closest(\'.person\').remove()">Remover trabalhador</button>':'')+'</div>'}function inpP(pr,l,k,v){return '<label>'+l+'<input id="'+pr+'_'+k+'" value="'+esc(v||'')+'"></label>'}function sig(id){return '<div class="sig" data-sig="'+id+'"><canvas></canvas><div class="sigbar"><span class="mut">Assine com o dedo</span><button class="btn btn2" style="width:auto;margin:0;min-height:40px" onclick="clearSig(this)">Limpar</button></div></div>'}function setupSigs(){document.querySelectorAll('.sig').forEach(box=>{if(box.ok)return;box.ok=1;let c=box.querySelector('canvas'),ctx=c.getContext('2d'),down=false,last=null;function size(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.strokeStyle='#263ccf';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round'}function pos(e){let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}function start(e){e.preventDefault();if(!c.width)size();down=true;last=pos(e)}function move(e){if(!down)return;e.preventDefault();let p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}function end(){down=false}setTimeout(size,80);c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',end);c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);window.addEventListener('mouseup',end)})}function getSig(id){let b=document.querySelector('[data-sig="'+id+'"]');return b&&b.querySelector('canvas').width?b.querySelector('canvas').toDataURL('image/png'):''}function clearSig(btn){let c=btn.closest('.sig').querySelector('canvas');c.getContext('2d').clearRect(0,0,c.width,c.height)}function addTrab(){let n=document.querySelectorAll('#trabs .person').length;trabs.insertAdjacentHTML('beforeend',person('trab'+n,{},true));setupSigs()}function loadPhoto(i){let f=i.files&&i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{current=current||base();current.foto=r.result;photoBox.innerHTML='<img src="'+r.result+'">'};r.readAsDataURL(f)}function clearPhoto(){current=current||base();current.foto='';photoBox.innerHTML='Nenhuma foto adicionada'}function collect(){let p=current||base();['empresa','inicio','fim','autenticador','tipo','condicao','area','setor','local','descricao','executantesEmp','obs','decl','evidencia'].forEach(k=>p[k]=document.getElementById(k)?.value||'');p.emerg={ponto:em_ponto.value,tel:em_tel.value,amb:em_amb.value,radio:em_radio.value};p.geral=geral.map((q,i)=>({q,resp:(document.querySelector('input[name="g'+i+'"]:checked')||{}).value||''}));p.riscos=[...document.querySelectorAll('#riskBox .risk')].map(box=>({nome:box.querySelector('b').textContent,controls:[...box.querySelectorAll('.chip')].map(ch=>({c:ch.textContent.trim(),on:ch.querySelector('input').checked}))}));p.emissor=readP('emissor');p.lider=readP('lider');p.trabs=[...document.querySelectorAll('#trabs .person')].map((x,i)=>readP('trab'+i)).filter(x=>x.nome);p.status=p.condicao;return p}function readP(pr){return{nome:document.getElementById(pr+'_nome')?.value||'',funcao:document.getElementById(pr+'_funcao')?.value||'',mat:document.getElementById(pr+'_mat')?.value||'',sig:getSig(pr+'_sig'),dt:new Date().toLocaleString('pt-BR')}}function salvar(){let p=collect();if(!p.empresa||!p.local||!p.descricao)return alert('Preencha empresa, local e descrição.');if(edit!=null)db.pses[edit]=p;else{db.pses.unshift(p);edit=0}save();alert('PSe salva.');go('list')}function del(i){if(confirm('Apagar?')){db.pses.splice(i,1);save();lista()}}function gerar(){renderPdf(collect())}function pdf(i){renderPdf(db.pses[i])}function fmt(v){return v?new Date(v).toLocaleString('pt-BR'):'--'}function mark(v,c){return v==c?'X':''}function renderPdf(p){let checks=p.geral.map(x=>'<tr><td>'+esc(x.q)+'</td><td>'+mark(x.resp,'S')+'</td><td>'+mark(x.resp,'N')+'</td><td>'+mark(x.resp,'NA')+'</td></tr>').join('');let risks=p.riscos.map(r=>'<div class="blk"><b>'+esc(r.nome)+'</b><br>'+r.controls.map(c=>'('+(c.on?'X':' ')+') '+esc(c.c)).join(' &nbsp; ')+'</div>').join('');let people=(t,a)=>'<h3>'+t+'</h3><table><tr><th>Nome</th><th>Função</th><th>Matrícula</th><th>Assinatura</th></tr>'+a.map(x=>'<tr><td>'+esc(x.nome)+'</td><td>'+esc(x.funcao)+'</td><td>'+esc(x.mat)+'</td><td>'+(x.sig?'<img class="sigp" src="'+x.sig+'"><br><small>'+esc(x.dt)+'</small>':'')+'</td></tr>').join('')+'</table>';let html='<html><head><title>PSe</title><style>@page{size:A4;margin:10mm}body{font-family:Arial;font-size:11px;color:#111}.head{display:grid;grid-template-columns:1fr 2fr 1fr;border:2px solid #111;align-items:center}.logo{text-align:center;font-size:22px;font-weight:900;color:#0b6b55}.ttl{background:#6f2477;color:#fff;text-align:center;font-size:20px;font-weight:900;padding:16px 8px}.ids{text-align:center;font-weight:900}.warn{border:1px solid #111;text-align:center;font-weight:900;padding:6px;margin:6px 0}h3{background:#6f2477;color:white;padding:6px;margin:8px 0 0}table{width:100%;border-collapse:collapse}td,th{border:1px solid #111;padding:5px;vertical-align:top}th{background:#eee}.blk{border:1px solid #111;padding:5px;border-top:0}.sigp{max-width:130px;max-height:70px}.foto{max-width:100%;max-height:430px;border:1px solid #111}</style></head><body><div class="head"><div class="logo">WorkSafePro</div><div class="ttl">Permissão de Serviço Eletrônica</div><div class="ids">Nº ID PSe:<br>'+esc(p.id)+'<br>Autenticação:<br>'+esc(p.auth)+'</div></div><div class="warn">EMERGÊNCIA, ABANDONO DE ÁREA OU MUDANÇA NAS CONDIÇÕES DE TRABALHO SUSPENDE ESTA PERMISSÃO.</div><h3>1. Informações Gerais</h3><table><tr><td><b>Empresa</b><br>'+esc(p.empresa)+'</td><td><b>Início</b><br>'+fmt(p.inicio)+'</td><td><b>Fim</b><br>'+fmt(p.fim)+'</td></tr><tr><td><b>Autenticador</b><br>'+esc(p.autenticador)+'</td><td><b>Tipo</b><br>'+esc(p.tipo)+'</td><td><b>Condição</b><br>'+esc(p.condicao)+'</td></tr><tr><td><b>Área</b><br>'+esc(p.area)+'</td><td><b>Setor</b><br>'+esc(p.setor)+'</td><td><b>Local</b><br>'+esc(p.local)+'</td></tr><tr><td colspan="3"><b>Descrição</b><br>'+esc(p.descricao)+'</td></tr><tr><td colspan="3"><b>Executantes</b><br>'+esc(p.executantesEmp)+'</td></tr><tr><td colspan="3"><b>Observações</b><br>'+esc(p.obs)+'</td></tr></table><h3>6. Lista Geral de Verificação</h3><table><tr><th>Quesito</th><th>Sim</th><th>Não</th><th>N/A</th></tr>'+checks+'</table><h3>7. Identificação e Controle de Riscos / Medidas Mitigadoras</h3>'+risks+'<h3>8. Emergência</h3><p>Telefone: '+esc(p.emerg.tel)+' | Ponto de encontro: '+esc(p.emerg.ponto)+' | Ambulância: '+esc(p.emerg.amb)+' | Rádio: '+esc(p.emerg.radio)+'</p><h3>10. Declaração</h3><p>'+esc(p.decl)+'</p>'+people('11. Emissor',[p.emissor])+people('12. Executor Líder',[p.lider])+people('13. Trabalhadores Envolvidos',p.trabs)+'<h3>14. Evidência Fotográfica</h3><p>'+esc(p.evidencia||'--')+'</p>'+(p.foto?'<img class="foto" src="'+p.foto+'">':'--')+'<script>setTimeout(function(){print()},500)<\/script></body></html>';let w=open('','_blank');w.document.write(html);w.document.close()}render()</script></body></html>
