<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WorkSafePro V2</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f6;font-family:Arial,sans-serif;color:#152426}.top{background:#0b6b55;color:white;padding:18px;text-align:center}.top h1{margin:0;font-size:24px}.main{padding:16px 16px 90px}.hero{background:linear-gradient(135deg,#073d34,#12a383);color:white;border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 10px 24px #0002}.hero h2{margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.module,.panel{background:white;border:1px solid #dce8e3;border-radius:20px;padding:16px;box-shadow:0 8px 18px #0001}.card strong{font-size:32px;color:#0b6b55}.module{display:grid;grid-template-columns:56px 1fr 20px;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px}.ico{height:56px;width:56px;border-radius:18px;background:#e8f7f1;display:grid;place-items:center;font-size:28px}.module b{font-size:17px}.module small,.muted{display:block;color:#637176;margin-top:4px}.btn{width:100%;min-height:54px;border:0;border-radius:15px;background:#0b6b55;color:white;font-weight:bold;font-size:16px;margin-top:10px;padding:12px}.btn2{background:white;color:#0b6b55;border:1px solid #bcd8cf}.btnR{background:#fff0f2;color:#b92d40;border:1px solid #f2bdc6}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce8e3;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;gap:6px}.bottom button{border:0;background:white;min-height:54px;border-radius:14px;font-weight:bold;color:#667}.bottom button.on{background:#e8f7f1;color:#0b6b55}.empty{background:white;border:1px dashed #cbd9d3;border-radius:18px;padding:36px;text-align:center;color:#667}.item{background:white;border:1px solid #dce8e3;border-radius:18px;padding:14px;margin-top:10px}.meta{color:#667;font-size:14px;margin-top:4px}label{font-weight:bold;color:#405057;font-size:14px;display:block;margin-top:12px}input,select,textarea{width:100%;min-height:52px;border:1px solid #bdcbc5;border-radius:12px;background:white;color:#152426;padding:12px;font-size:16px;margin-top:6px}textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section{font-size:20px;font-weight:900;margin:18px 0 8px;border-left:5px solid #0b6b55;padding-left:10px}.chip{display:inline-block;padding:8px 10px;border-radius:999px;background:#e8f7f1;color:#0b6b55;font-weight:bold;font-size:12px;margin:4px 4px 0 0}.box{background:#fbfdfc;border:1px solid #dce8e3;border-radius:14px;padding:12px;margin-top:10px}.sig{border:1px solid #0b6b55;border-radius:14px;overflow:hidden;margin-top:8px;background:white}.sig canvas{display:block;width:100%;height:170px;background:white;touch-action:none}.sigbar{display:flex;justify-content:space-between;align-items:center;background:#e8f7f1;padding:8px}.tag{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:bold;margin-top:6px}.ok{background:#e8f7f1;color:#0b6b55}.warn{background:#fff4dc;color:#a06000}.bad{background:#ffe6eb;color:#b92c3d}@media(min-width:760px){.main{max-width:960px;margin:auto}.modules{display:grid;grid-template-columns:1fr 1fr;gap:12px}.module{margin-top:0}}</style></head><body><header class="top"><h1>WorkSafePro V2</h1><small>Segurança do Trabalho em Campo</small></header><main class="main" id="app"></main><nav class="bottom"><button onclick="go('home')" id="bhome">Início</button><button onclick="go('pt')" id="bpt">PT</button><button onclick="go('insp')" id="binsp">Inspeção</button><button onclick="go('epi')" id="bepi">EPI</button></nav><script>let cur='home';let db=JSON.parse(localStorage.getItem('wsp-v2-smart')||'{"pts":[],"insps":[],"epis":[],"workers":[],"rncs":[],"dds":[]}');const PT={"Trabalho a quente":{r:["Explosão / Incêndio","Queimaduras","Projeção de materiais / fagulhas","Produtos químicos / corrosivos / tóxicos"],e:["Máquina de solda","Maçarico","Ferramentas manuais"],p:["Materiais ou gases combustíveis ausentes ou controlados","Cilindros com válvula corta chama","Equipamentos de combate a incêndio disponíveis","Local limpo, isolado e sinalizado","EPIs para trabalho a quente adequados","Verificação após 60 minutos do término"]},"Trabalho em altura":{r:["Queda de diferente nível","Queda de materiais / objetos","Condições climáticas desfavoráveis","Contato acidental com partes energizadas"],e:["Andaimes / Escadas","Plataforma elevatória","Ferramentas manuais"],p:["Condições atmosféricas favoráveis","Escadas em boas condições","Pontos de ancoragem / linha de vida aprovados","Executantes em boas condições físicas e psicológicas","Equipamentos de prevenção de queda em perfeitas condições","Executantes capacitados e autorizados"]},"Içamento de carga":{r:["Queda de material / objetos","Ruptura em cabos de aço","Prensamento de membros / cortes","Atropelamento / abalroamento"],e:["Guindaste / Munck","Cintas / cabos / acessórios","Corda guia"],p:["Isolamento e sinalização do perímetro","Sem trabalho sobreposto durante o içamento","Plano de rigging e ART quando aplicável","Operador habilitado","Piso adequado para patolagem","Comunicação adequada entre sinaleiro e operador","Acessórios inspecionados e aprovados"]},"Eletricidade":{r:["Choque elétrico","Contato acidental em partes energizadas","Acúmulo de eletricidade estática","Trabalhos elétricos em áreas classificadas"],e:["Equipamento elétrico","Ferramentas isolantes","Bloqueio e etiquetagem"],p:["Fontes de energia desligadas","Fontes de energia bloqueadas","Teste de ausência de tensão realizado","Equipamento sinalizado com cartão do responsável","Local seco e sem umidade","Sistema livre de energia residual"]},"Escavação":{r:["Desmoronamento / Soterramento","Tubulação e cabos enterrados","Queda em vala","Piso escorregadio / umidade"],e:["Ferramentas manuais","Máquinas de escavação","Escadas de acesso"],p:["Ausência de eletrodutos e dutos subterrâneos verificada","Escoramento/talude adequado","Acesso seguro à escavação","Saída e resgate rápido garantidos","Escada de acesso adequada","Riscos de torção, escorregão e queda controlados"]},"Espaço confinado":{r:["Atmosfera perigosa","Produtos químicos / corrosivos / tóxicos","Deficiência de oxigênio","Resgate dificultado"],e:["Medidor de gases","Ventilação externa","Equipamentos de resgate"],p:["Análise do ambiente com medidor de gases","PET preenchida","Equipamentos de resgate disponíveis","Ventilação externa utilizada quando necessário","Temperatura adequada","Bombeiro/brigadista ciente","Iluminação adequada"]},"Trabalho a frio":{r:["Prensamento de membros / cortes","Ergonomia","Cantos vivos / arestas perfuro cortantes","Ruído no local"],e:["Ferramentas manuais","Equipamento elétrico","Ferramenta pneumática"],p:["Ferramentas em bom estado","Equipamentos com proteções","Risco de lesões nas mãos controlado","Equipamentos elétricos adequados","Dispositivo de parada de emergência quando aplicável","Executante possui habilidade e conhecimento"]}};function save(){localStorage.setItem('wsp-v2-smart',JSON.stringify(db));render()}function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}function today(){return new Date().toISOString().slice(0,10)}function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}function go(x){cur=x;render();scrollTo(0,0)}function mod(i,t,s,g){return `<button class="module" onclick="go('${g}')"><div class="ico">${i}</div><div><b>${t}</b><small>${s}</small></div><div>›</div></button>`}function render(){['home','pt','insp','epi'].forEach(x=>{let b=document.getElementById('b'+x);if(b)b.classList.toggle('on',cur==x)});if(cur==='home')home();if(cur==='pt')ptList();if(cur==='insp')page('Inspeções','Nova inspeção','insps');if(cur==='epi')page('Controle de EPIs','Novo EPI','epis');if(cur==='workers')workers();if(cur==='rnc')page('RNC','Nova RNC','rncs');if(cur==='dds')page('DDS','Novo DDS','dds')}function home(){app.innerHTML=`<div class="hero"><h2>Central de Campo</h2><p>PT inteligente com riscos automáticos, executantes com função e assinatura, inspeções, EPIs e relatórios offline.</p></div><div class="grid"><div class="card"><strong>${db.pts.length}</strong><br><span>PTs</span></div><div class="card"><strong>${db.insps.length}</strong><br><span>Inspeções</span></div><div class="card"><strong>${db.epis.length}</strong><br><span>EPIs</span></div><div class="card"><strong>${db.workers.length}</strong><br><span>Trabalhadores</span></div></div><div class="modules" style="margin-top:16px">${mod('📝','Permissão de Trabalho','PT inteligente baseada em modelo profissional','pt')}${mod('🔎','Inspeções','Checklists de campo','insp')}${mod('🦺','EPIs','Estoque e entrega','epi')}${mod('👷','Trabalhadores','Cadastro para executantes','workers')}${mod('⚠️','RNC','Não conformidades','rnc')}${mod('💬','DDS','Diálogo diário','dds')}</div>`}function tag(s){return `<span class="tag ${/encerr|ok|aprov/i.test(s)?'ok':/venc|bloq|não/i.test(s)?'bad':'warn'}">${esc(s)}</span>`}function ptList(){app.innerHTML=`<div class="hero"><h2>Permissão de Trabalho Inteligente</h2><p>Escolha o tipo de trabalho e o app adiciona riscos, equipamentos e precauções automaticamente. Tudo pode ser editado.</p></div><button class="btn" onclick="ptForm()">Nova PT Inteligente</button>`+(db.pts.length?db.pts.map((p,i)=>`<div class="item"><b>${esc(p.tipo)} - ${esc(p.local)}</b><div class="meta">${p.data} | ${p.execs.length} executante(s) | Potencial ${p.pg}</div>${tag(p.status)}<button class="btn btn2" onclick="ptForm(${i})">Editar</button><button class="btn" onclick="ptPdf(${i})">Gerar PDF</button><button class="btn btnR" onclick="del('pts',${i})">Apagar</button></div>`).join(''):'<div class="empty">Nenhuma PT cadastrada.</div>')}function chips(arr){return arr.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}function ptForm(i){let p=i!=null?db.pts[i]:{tipo:'Trabalho em altura',pg:'C',data:today(),hora:'',mo:'Interna',empresa:'',local:'',equip:'',desligado:'Não',tag:'',imp:'',desc:'',riscos:[],equipamentos:[],precaucoes:[],epis:[],execs:[],lib:{area:'',exec:'',seg:'',sig:''},enc:{concluido:'Sim',organizado:'Sim',ferramentas:'Sim',obs:''},status:'emitida'};let base=PT[p.tipo]||PT['Trabalho em altura'];app.innerHTML=`<div class="hero"><h2>${i!=null?'Editar':'Nova'} PT Inteligente</h2><p>Modelo com automação baseada no tipo de trabalho.</p></div><div class="panel"><label>Tipo de trabalho<select id="tipo" onchange="applyTipo()">${Object.keys(PT).map(t=>`<option ${p.tipo==t?'selected':''}>${t}</option>`).join('')}</select></label><div class="row"><label>Potencial<select id="pg"><option ${p.pg=='A'?'selected':''}>A</option><option ${p.pg=='B'?'selected':''}>B</option><option ${p.pg=='C'?'selected':''}>C</option></select></label><label>Data<input id="data" type="date" value="${p.data}"></label></div><div class="row"><label>Hora<input id="hora" type="time" value="${p.hora}"></label><label>Mão de obra<select id="mo"><option ${p.mo=='Interna'?'selected':''}>Interna</option><option ${p.mo=='Externa'?'selected':''}>Externa</option></select></label></div><label>Empresa<input id="empresa" value="${esc(p.empresa)}"></label><label>Local do trabalho<input id="local" value="${esc(p.local)}"></label><label>Equipamento envolvido<input id="equip" value="${esc(p.equip)}"></label><div class="row"><label>Equipamento desligado<select id="desligado"><option ${p.desligado=='Não'?'selected':''}>Não</option><option ${p.desligado=='Sim'?'selected':''}>Sim</option></select></label><label>TAG / impedimento<input id="tag" value="${esc(p.tag||p.imp)}"></label></div><label>Descrição do trabalho<textarea id="desc">${esc(p.desc)}</textarea></label><div class="section">Riscos automáticos e manuais</div><div id="riscos">${(p.riscos.length?p.riscos:base.r).map(x=>row('risk',x)).join('')}</div><button class="btn btn2" onclick="addRow('riscos','risk')">+ Risco manual</button><div class="section">Equipamentos utilizados</div><div id="equipamentos">${(p.equipamentos.length?p.equipamentos:base.e).map(x=>row('eq',x)).join('')}</div><button class="btn btn2" onclick="addRow('equipamentos','eq')">+ Equipamento manual</button><div class="section">Precauções por tipo de trabalho</div><div id="precaucoes">${(p.precaucoes.length?p.precaucoes:base.p.map(x=>({item:x,resp:'S'}))).map(x=>checkRow(x.item,x.resp)).join('')}</div><button class="btn btn2" onclick="addCheck()">+ Precaução manual</button><div class="section">EPIs obrigatórios</div><div id="epis">${(p.epis.length?p.epis:['Capacete com jugular','Óculos de segurança','Calçado de segurança','Luva apropriada ao risco','Sinalização e isolamento']).map(x=>row('epi',x)).join('')}</div><button class="btn btn2" onclick="addRow('epis','epi')">+ EPI manual</button><div class="section">Executantes autorizados</div><p class="muted">Informe nome, função e colete assinatura individual.</p><div id="execs">${p.execs.map((e,idx)=>execRow(e,idx)).join('')}</div><button class="btn btn2" onclick="addExec()">+ Adicionar executante</button><div class="section">Liberação</div><label>Dono da área / setor<input id="libArea" value="${esc(p.lib.area)}"></label><label>Responsável pela execução<input id="libExec" value="${esc(p.lib.exec)}"></label><label>Segurança do Trabalho<input id="libSeg" value="${esc(p.lib.seg)}"></label><label>Assinatura da liberação</label>${sig('libSig')}<div class="section">Encerramento da PT</div><div class="row"><label>Trabalho concluído?<select id="encCon"><option ${p.enc.concluido=='Sim'?'selected':''}>Sim</option><option ${p.enc.concluido=='Não'?'selected':''}>Não</option></select></label><label>Local organizado?<select id="encOrg"><option ${p.enc.organizado=='Sim'?'selected':''}>Sim</option><option ${p.enc.organizado=='Não'?'selected':''}>Não</option></select></label></div><label>Ferramentas recolhidas?<select id="encFer"><option ${p.enc.ferramentas=='Sim'?'selected':''}>Sim</option><option ${p.enc.ferramentas=='Não'?'selected':''}>Não</option></select></label><label>Observações de encerramento<textarea id="encObs">${esc(p.enc.obs)}</textarea></label><button class="btn" onclick="savePT(${i!=null?i:'null'})">Salvar PT</button></div>`;setupSigs()}function row(cls,v){return `<div class="box"><div class="row"><input class="${cls}" value="${esc(v||'')}"><button class="btn btnR" onclick="this.closest('.box').remove()">Apagar</button></div></div>`}function checkRow(item,resp){return `<div class="box"><label>Item<input class="precItem" value="${esc(item||'')}"></label><label>Resposta<select class="precResp"><option ${resp=='S'?'selected':''}>S</option><option ${resp=='NA'?'selected':''}>NA</option><option ${resp=='N'?'selected':''}>N</option></select></label><button class="btn btnR" onclick="this.closest('.box').remove()">Apagar</button></div>`}function execRow(e,idx){return `<div class="box"><label>Nome<input class="exNome" value="${esc(e.nome||'')}"></label><label>Função<input class="exFunc" value="${esc(e.funcao||'')}"></label><label>Assinatura do executante</label>${sig('exSig'+idx)}<button class="btn btnR" onclick="this.closest('.box').remove()">Apagar executante</button></div>`}function addRow(id,cls){document.getElementById(id).insertAdjacentHTML('beforeend',row(cls,''))}function addCheck(){document.getElementById('precaucoes').insertAdjacentHTML('beforeend',checkRow('','S'))}function addExec(){let n=document.querySelectorAll('.exNome').length;document.getElementById('execs').insertAdjacentHTML('beforeend',execRow({},n));setupSigs()}function applyTipo(){let b=PT[document.getElementById('tipo').value];document.getElementById('riscos').innerHTML=b.r.map(x=>row('risk',x)).join('');document.getElementById('equipamentos').innerHTML=b.e.map(x=>row('eq',x)).join('');document.getElementById('precaucoes').innerHTML=b.p.map(x=>checkRow(x,'S')).join('')}function savePT(i){let ex=[...document.querySelectorAll('.exNome')].map((n,idx)=>({nome:n.value,funcao:document.querySelectorAll('.exFunc')[idx].value,sig:getSig('exSig'+idx)})).filter(x=>x.nome);let p={tipo:tipo.value,pg:pg.value,data:data.value,hora:hora.value,mo:mo.value,empresa:empresa.value,local:local.value,equip:equip.value,desligado:desligado.value,tag:tag.value,desc:desc.value,riscos:[...document.querySelectorAll('.risk')].map(x=>x.value).filter(Boolean),equipamentos:[...document.querySelectorAll('.eq')].map(x=>x.value).filter(Boolean),precaucoes:[...document.querySelectorAll('.precItem')].map((x,idx)=>({item:x.value,resp:document.querySelectorAll('.precResp')[idx].value})).filter(x=>x.item),epis:[...document.querySelectorAll('.epi')].map(x=>x.value).filter(Boolean),execs:ex,lib:{area:libArea.value,exec:libExec.value,seg:libSeg.value,sig:getSig('libSig')},enc:{concluido:encCon.value,organizado:encOrg.value,ferramentas:encFer.value,obs:encObs.value},status:'emitida'};if(!p.local||!p.desc)return alert('Preencha local e descrição do trabalho.');if(i!=null)db.pts[i]=p;else db.pts.unshift(p);save();go('pt')}function sig(id){return `<div class="sig" data-sig="${id}"><canvas></canvas><div class="sigbar"><span class="muted">Assine com o dedo</span><button class="btn btn2" style="width:auto;margin:0" onclick="clearSig(this)">Limpar</button></div></div>`}function setupSigs(){document.querySelectorAll('.sig').forEach(box=>{if(box.ok)return;box.ok=1;let c=box.querySelector('canvas'),ctx=c.getContext('2d'),down=false,last=null;function size(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.strokeStyle='#0b6b55';ctx.lineWidth=3;ctx.lineCap='round'}function pos(e){let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}function start(e){e.preventDefault();if(!c.width)size();down=true;last=pos(e)}function move(e){if(!down)return;e.preventDefault();let p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}function end(){down=false}setTimeout(size,80);c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',end);c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);window.addEventListener('mouseup',end)})}function clearSig(b){let c=b.closest('.sig').querySelector('canvas');c.getContext('2d').clearRect(0,0,c.width,c.height)}function getSig(id){let b=document.querySelector(`[data-sig="${id}"]`);return b&&b.querySelector('canvas').width?b.querySelector('canvas').toDataURL('image/png'):''}function ptPdf(i){let p=db.pts[i];let html=`<html><head><title>PT</title><style>body{font-family:Arial;padding:18px}h1{text-align:center}.head{border-bottom:4px solid #0b6b55;padding-bottom:8px}.box{border:1px solid #333;margin:8px 0;padding:8px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #333;padding:6px;text-align:left}.sec{background:#0b6b55;color:white;font-weight:bold;padding:6px;margin-top:10px}img{max-width:220px;border:1px solid #999}</style></head><body><div class="head"><h1>PERMISSÃO DE TRABALHO</h1><b>WorkSafePro</b> | Data: ${p.data} Hora: ${p.hora} | Potencial: ${p.pg}</div><div class="box"><b>Mão de obra:</b> ${p.mo} | <b>Empresa:</b> ${p.empresa}<br><b>Local:</b> ${p.local} | <b>Equipamento:</b> ${p.equip}<br><b>Equipamento desligado:</b> ${p.desligado} | <b>TAG:</b> ${p.tag}<br><b>Descrição:</b> ${p.desc}</div><div class="sec">RISCOS POTENCIAIS</div><div>${p.riscos.map(x=>'☑ '+x).join('<br>')}</div><div class="sec">EQUIPAMENTOS UTILIZADOS</div><div>${p.equipamentos.map(x=>'☑ '+x).join('<br>')}</div><div class="sec">PRECAUÇÕES</div><table><tr><th>Item</th><th>Resp.</th></tr>${p.precaucoes.map(x=>`<tr><td>${x.item}</td><td>${x.resp}</td></tr>`).join('')}</table><div class="sec">EPIs OBRIGATÓRIOS</div><div>${p.epis.map(x=>'☑ '+x).join('<br>')}</div><div class="sec">EXECUTANTES AUTORIZADOS</div><table><tr><th>Nome</th><th>Função</th><th>Assinatura</th></tr>${p.execs.map(e=>`<tr><td>${e.nome}</td><td>${e.funcao}</td><td>${e.sig?'<img src="'+e.sig+'">':''}</td></tr>`).join('')}</table><div class="sec">LIBERAÇÃO</div><p>Dono da área: ${p.lib.area}<br>Responsável execução: ${p.lib.exec}<br>Segurança do Trabalho: ${p.lib.seg}</p>${p.lib.sig?'<img src="'+p.lib.sig+'">':''}<div class="sec">ENCERRAMENTO</div><p>Trabalho concluído: ${p.enc.concluido} | Local organizado: ${p.enc.organizado} | Ferramentas recolhidas: ${p.enc.ferramentas}<br>Obs: ${p.enc.obs}</p><script>setTimeout(()=>print(),500)<\/script></body></html>`;let w=open('','_blank');w.document.write(html)}function page(title,btn,key){app.innerHTML=`<div class="hero"><h2>${title}</h2><p>Área em reorganização profissional V2.</p></div><button class="btn" onclick="add('${key}')">${btn}</button>`+(db[key].length?db[key].map((x,i)=>`<div class="item"><b>${x.nome||x.titulo||'Registro '+(i+1)}</b><div class="meta">Criado em ${x.data}</div><button class="btn btnR" onclick="del('${key}',${i})">Apagar</button></div>`).join(''):'<div class="empty">Nenhum registro cadastrado.</div>')}function workers(){page('Trabalhadores','Novo trabalhador','workers')}function add(k){let nome=prompt('Nome ou título do registro:');if(!nome)return;db[k].unshift({nome,data:new Date().toLocaleString('pt-BR')});save()}function del(k,i){if(confirm('Apagar?')){db[k].splice(i,1);save()}}render()</script></body></html>
