<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WorkSafePro V2</title><style>body{margin:0;background:#f5f8f6;font-family:Arial,sans-serif;color:#152426}.top{background:#0b6b55;color:white;padding:18px;text-align:center}.top h1{margin:0;font-size:24px}.main{padding:16px 16px 90px}.hero{background:linear-gradient(135deg,#073d34,#12a383);color:white;border-radius:24px;padding:24px;margin-bottom:16px;box-shadow:0 10px 24px #0002}.hero h2{margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.module{background:white;border:1px solid #dce8e3;border-radius:20px;padding:16px;box-shadow:0 8px 18px #0001}.card strong{font-size:32px;color:#0b6b55}.module{display:grid;grid-template-columns:56px 1fr 20px;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px}.ico{height:56px;width:56px;border-radius:18px;background:#e8f7f1;display:grid;place-items:center;font-size:28px}.module b{font-size:17px}.module small{display:block;color:#637176;margin-top:4px}.btn{width:100%;min-height:54px;border:0;border-radius:15px;background:#0b6b55;color:white;font-weight:bold;font-size:16px;margin-top:10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce8e3;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;gap:6px}.bottom button{border:0;background:white;min-height:54px;border-radius:14px;font-weight:bold;color:#667}.bottom button.on{background:#e8f7f1;color:#0b6b55}.empty{background:white;border:1px dashed #cbd9d3;border-radius:18px;padding:36px;text-align:center;color:#667}.item{background:white;border:1px solid #dce8e3;border-radius:18px;padding:14px;margin-top:10px}.meta{color:#667;font-size:14px;margin-top:4px}</style></head><body><header class="top"><h1>WorkSafePro V2</h1><small>Segurança do Trabalho em Campo</small></header><main class="main" id="app"></main><nav class="bottom"><button onclick="go('home')" id="bhome">Início</button><button onclick="go('pt')" id="bpt">PT</button><button onclick="go('insp')" id="binsp">Inspeção</button><button onclick="go('epi')" id="bepi">EPI</button></nav><script>let cur='home';let db=JSON.parse(localStorage.getItem('wsp-v2')||'{"pts":[],"insps":[],"epis":[],"workers":[],"rncs":[],"dds":[]}');function save(){localStorage.setItem('wsp-v2',JSON.stringify(db));render()}function go(x){cur=x;render()}function mod(i,t,s,g){return `<button class="module" onclick="go('${g}')"><div class="ico">${i}</div><div><b>${t}</b><small>${s}</small></div><div>›</div></button>`}function render(){['home','pt','insp','epi'].forEach(x=>{let b=document.getElementById('b'+x);if(b)b.classList.toggle('on',cur==x)});if(cur==='home')home();if(cur==='pt')page('Permissão de Trabalho','Nova PT','pts');if(cur==='insp')page('Inspeções','Nova inspeção','insps');if(cur==='epi')page('Controle de EPIs','Novo EPI','epis');if(cur==='workers')page('Trabalhadores','Novo trabalhador','workers');if(cur==='rnc')page('RNC','Nova RNC','rncs');if(cur==='dds')page('DDS','Novo DDS','dds')}function home(){app.innerHTML=`<div class="hero"><h2>Central de Campo</h2><p>Organize PT, inspeções, EPIs, trabalhadores, RNC, DDS e relatórios offline.</p></div><div class="grid"><div class="card"><strong>${db.pts.length}</strong><br><span>PTs</span></div><div class="card"><strong>${db.insps.length}</strong><br><span>Inspeções</span></div><div class="card"><strong>${db.epis.length}</strong><br><span>EPIs</span></div><div class="card"><strong>${db.rncs.length}</strong><br><span>RNC</span></div></div>${mod('📁','Documentação','PT, DDS e RNC','pt')}${mod('🔎','Inspeções','Checklists de campo','insp')}${mod('🦺','EPIs','Estoque e entrega','epi')}${mod('👷','Trabalhadores','ASO e NRs','workers')}${mod('⚠️','RNC','Não conformidades','rnc')}${mod('💬','DDS','Diálogo diário','dds')}`;}function page(title,btn,key){app.innerHTML=`<div class="hero"><h2>${title}</h2><p>Área em reorganização profissional V2.</p></div><button class="btn" onclick="add('${key}')">${btn}</button>`+(db[key].length?db[key].map((x,i)=>`<div class="item"><b>${x.nome||x.titulo||'Registro '+(i+1)}</b><div class="meta">Criado em ${x.data}</div><button class="btn" onclick="del('${key}',${i})">Apagar</button></div>`).join(''):'<div class="empty">Nenhum registro cadastrado.</div>')}function add(k){let nome=prompt('Nome ou título do registro:');if(!nome)return;db[k].unshift({nome,data:new Date().toLocaleString('pt-BR')});save()}function del(k,i){if(confirm('Apagar?')){db[k].splice(i,1);save()}}render()</script></body></html>
