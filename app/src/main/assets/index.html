<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WorkSafePro Campo</title>
<style>
:root{--bg:#0F1117;--card:#1A1D26;--card2:#222736;--txt:#E0E0E0;--mut:#9aa3b2;--pri:#00C896;--red:#FF4C4C;--yel:#FFB347;--line:#2d3344}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif;font-size:16px}.top{position:sticky;top:0;z-index:5;background:#0F1117ee;border-bottom:1px solid var(--line);padding:14px 14px 10px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{font-size:24px;margin:0;color:var(--pri)}.brand small{display:block;color:var(--mut);font-size:12px;margin-top:3px}.sync{font-size:12px;color:var(--mut)}.tabs{display:flex;gap:8px;overflow:auto;padding-top:12px}.tabs button{white-space:nowrap;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:11px 14px;font-weight:bold}.tabs button.on{background:var(--pri);color:#06110F;border-color:var(--pri)}main{padding:14px 14px 90px}.sec{display:none}.sec.on{display:block}.grid{display:grid;gap:12px}.cards{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 28px #0006}.kpi strong{font-size:30px;display:block;color:var(--pri)}.kpi span{font-size:13px;color:var(--mut)}h2{font-size:20px;margin:10px 0 12px}h3{font-size:17px;margin:4px 0 10px}.btn{width:100%;min-height:50px;border:0;border-radius:14px;background:var(--pri);color:#06110F;font-weight:800;font-size:15px;padding:12px;margin-top:8px}.btn2{background:var(--card2);color:var(--txt);border:1px solid var(--line)}.btnR{background:#3a171b;color:#ffb8b8;border:1px solid #74313a}.btnY{background:#3a2a13;color:#ffd99c;border:1px solid #76521d}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:var(--mut);font-weight:bold;font-size:13px;margin-top:10px}input,select,textarea{width:100%;min-height:48px;background:#11141d;color:var(--txt);border:1px solid var(--line);border-radius:13px;padding:12px;font-size:16px;margin-top:6px}textarea{min-height:90px;resize:vertical}.list{display:grid;gap:10px;margin-top:12px}.item{background:#11141d;border:1px solid var(--line);border-radius:15px;padding:12px}.item b{color:#fff}.meta{color:var(--mut);font-size:13px;line-height:1.45}.tag{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:bold;margin-top:6px}.ok{background:#073b31;color:var(--pri)}.bad{background:#451c22;color:#ff8f8f}.warn{background:#463112;color:#ffd08b}.sig{background:#07090d;border:1px dashed var(--pri);border-radius:14px;margin-top:8px;overflow:hidden}.sig canvas{width:100%;height:150px;display:block;touch-action:none}.sig div{display:flex;justify-content:space-between;align-items:center;padding:8px;background:#11141d}.photo{max-width:100%;border-radius:12px;margin-top:8px;display:none;border:1px solid var(--line)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0F1117ee;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;z-index:7}.bottom button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;min-height:52px;font-size:11px;font-weight:bold}.bottom button.on{background:var(--pri);color:#06110F}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:end;z-index:20}.modal.on{display:grid}.sheet{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px;border:1px solid var(--line)}.danger{color:var(--red)}.yellow{color:var(--yel)}.green{color:var(--pri)}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left}@media(min-width:720px){main{max-width:980px;margin:auto}.cards{grid-template-columns:repeat(4,1fr)}.bottom{left:50%;transform:translateX(-50%);max-width:980px;border-radius:18px 18px 0 0}.sheet{max-width:720px;border-radius:22px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div><h1>WorkSafePro</h1><small>Segurança do Trabalho em Campo</small></div><div class="sync" id="saveStatus">offline</div></div><nav class="tabs" id="tabs"></nav></header>
<main>
<section id="dash" class="sec on"></section><section id="ipdf" class="sec"></section><section id="insp" class="sec"></section><section id="epi" class="sec"></section><section id="trab" class="sec"></section><section id="rnc" class="sec"></section><section id="dds" class="sec"></section><section id="rel" class="sec"></section>
</main>
<nav class="bottom"><button onclick="go('dash')">Início</button><button onclick="go('ipdf')">IPDF</button><button onclick="go('insp')">Inspeção</button><button onclick="go('epi')">EPI</button></nav>
<div id="modal" class="modal"><div class="sheet"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h2 id="mt">Registro</h2><button class="btn btn2" style="width:auto" onclick="closeM()">Fechar</button></div><div id="mb"></div></div></div>
<script>
const K='worksafepro-campo-v1';const $=id=>document.getElementById(id);const today=()=>new Date().toISOString().slice(0,10);const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);const br=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'-';const days=d=>Math.ceil((new Date(d+'T12:00:00')-new Date())/864e5);const tabs=[['dash','Início'],['ipdf','IPDF/APR'],['insp','Inspeção'],['epi','EPI'],['trab','Trabalhadores'],['rnc','RNC'],['dds','DDS'],['rel','Relatórios']];
function seed(){return{workers:[{id:uid(),nome:'João Silva',funcao:'Montador',cpf:'000.000.000-00',empresa:'Própria',aso:add(45),nrs:[{nr:'NR-35',v:add(80)},{nr:'NR-18',v:add(160)}]},{id:uid(),nome:'Maria Souza',funcao:'Ajudante',cpf:'111.111.111-11',empresa:'Terceira',aso:add(-4),nrs:[{nr:'NR-06',v:add(200)}]}],ipdfs:[],insps:[],epis:[{id:uid(),nome:'Capacete com jugular',ca:'12345',v:add(90),est:12,min:5,ent:[]},{id:uid(),nome:'Luva vaqueta',ca:'98765',v:add(20),est:4,min:6,ent:[]}],rncs:[],dds:[],cfg:{empresa:'Minha Empresa',obra:'Obra / Frente de Serviço',emissor:'TST'}}}function add(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}let db=JSON.parse(localStorage.getItem(K)||'null')||seed();let cur='dash';function save(){localStorage.setItem(K,JSON.stringify(db));$('saveStatus').textContent='salvo '+new Date().toLocaleTimeString('pt-BR').slice(0,5);render()}function tag(s){let c=s&&String(s).match(/venc|alto|crít|nao|não|inap/) ?'bad':String(s).match(/pend|baixo|médio|medio|aten|abert/)?'warn':'ok';return '<span class="tag '+c+'">'+(s||'-')+'</span>'}function apto(w){if(days(w.aso)<0)return'inapto';if(days(w.aso)<=30)return'pendente';for(const n of w.nrs||[]){if(days(n.v)<0)return'inapto';if(days(n.v)<=30)return'pendente'}return'apto'}function workerOptions(){return db.workers.map(w=>'<option value="'+w.id+'">'+w.nome+' - '+w.funcao+' ('+apto(w)+')</option>').join('')}function selected(sel){return[...$(sel).selectedOptions].map(o=>o.value)}function go(id){cur=id;document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id==id));document.querySelectorAll('.tabs button,.bottom button').forEach(b=>b.classList.remove('on'));render();window.scrollTo(0,0)}
function render(){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));$(cur).classList.add('on');$('tabs').innerHTML=tabs.map(t=>'<button class="'+(cur==t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>').join('');document.querySelectorAll('.bottom button').forEach((b,i)=>b.classList.toggle('on',tabs[i]&&tabs[i][0]==cur));renderDash();renderIPDF();renderInsp();renderEPI();renderTrab();renderRNC();renderDDS();renderRel()}
function renderDash(){let ab=db.ipdfs.filter(x=>x.status!='encerrada').length,nc=db.rncs.filter(x=>x.status!='encerrada').length,ea=db.epis.filter(e=>days(e.v)<=30||e.est<=e.min).length,wa=db.workers.filter(w=>apto(w)!='apto').length;$('dash').innerHTML='<h2>Painel de campo</h2><div class="grid cards"><div class="card kpi"><strong>'+ab+'</strong><span>IPDF/APR abertas</span></div><div class="card kpi"><strong>'+db.insps.length+'</strong><span>Inspeções</span></div><div class="card kpi"><strong>'+nc+'</strong><span>RNC abertas</span></div><div class="card kpi"><strong>'+ea+'</strong><span>Alertas de EPI</span></div></div><div class="card" style="margin-top:12px"><h3>Ações rápidas</h3><button class="btn" onclick="openIPDF()">Nova IPDF / APR</button><button class="btn btn2" onclick="openInsp()">Nova inspeção de campo</button><button class="btn btn2" onclick="openEntrega()">Entrega de EPI com assinatura</button><button class="btn btn2" onclick="openDDS()">Registrar DDS</button></div><div class="card" style="margin-top:12px"><h3>Alertas</h3>'+alerts().join('')+'</div>'}function alerts(){let a=[];db.workers.forEach(w=>{if(apto(w)!='apto')a.push('<div class="item"><b>'+w.nome+'</b><div class="meta">Aptidão: '+tag(apto(w))+' ASO '+br(w.aso)+'</div></div>')});db.epis.forEach(e=>{if(days(e.v)<=30||e.est<=e.min)a.push('<div class="item"><b>'+e.nome+'</b><div class="meta">CA vence: '+br(e.v)+' | Estoque: '+e.est+'</div></div>')});db.rncs.forEach(r=>{if(r.status!='encerrada'&&days(r.prazo)<0)a.push('<div class="item"><b>RNC vencida</b><div class="meta">'+r.desc+' prazo '+br(r.prazo)+'</div></div>')});return a.length?a:['<div class="meta">Sem alertas críticos.</div>']}
function list(arr,fn){return'<div class="list">'+(arr.length?arr.map(fn).join(''):'<div class="meta">Nenhum registro.</div>')+'</div>'}
function renderIPDF(){$('ipdf').innerHTML='<h2>IPDF / APR de Campo</h2><div class="card"><button class="btn" onclick="openIPDF()">Criar IPDF</button></div>'+list(db.ipdfs,x=>'<div class="item"><b>'+x.ativ+'</b><div class="meta">'+br(x.data)+' | '+x.frente+' | '+x.resp+'</div>'+tag(x.status)+'<button class="btn btn2" onclick="viewIPDF(\''+x.id+'\')">Abrir</button></div>')}
function openIPDF(){modal('Nova IPDF / APR','<label>Data<input id="iData" type="date" value="'+today()+'"></label><label>Frente/local<input id="iFrente" placeholder="Ex.: Pipe rack, escavação, telhado"></label><label>Atividade executada<textarea id="iAtiv" placeholder="Descreva a atividade"></textarea></label><label>Responsável técnico / encarregado<input id="iResp"></label><label>Funcionários envolvidos<select id="iExec" multiple size="5">'+workerOptions()+'</select></label><label>Riscos principais<textarea id="iRiscos" placeholder="Altura, queda de material, corte, ruído, poeira..."></textarea></label><label>Medidas de controle<textarea id="iCtrl" placeholder="Isolamento, DDS, EPC, trava quedas, bloqueio..."></textarea></label><label>EPIs obrigatórios<textarea id="iEpis"></textarea></label><label>Foto da atividade<input type="file" accept="image/*" capture="environment" onchange="pic(this,\'iFoto\')"><img id="iFoto" class="photo"></label><label>Assinatura responsável</label>'+sig('iSig')+'<button class="btn" onclick="saveIPDF()">Salvar IPDF</button>')}
function saveIPDF(){let r={id:uid(),data:val('iData'),frente:val('iFrente'),ativ:val('iAtiv'),resp:val('iResp'),exec:selected('iExec'),riscos:val('iRiscos'),ctrl:val('iCtrl'),epis:val('iEpis'),foto:$('iFoto')?.src||'',sig:getSig('iSig'),status:'aberta'};if(!r.frente||!r.ativ)return toast('Preencha frente e atividade');db.ipdfs.unshift(r);closeM();save()}function viewIPDF(id){let x=db.ipdfs.find(a=>a.id==id);modal('IPDF / APR','<div class="item"><b>'+x.ativ+'</b><div class="meta">'+br(x.data)+' | '+x.frente+' | Resp.: '+x.resp+'<br>Riscos: '+x.riscos+'<br>Controles: '+x.ctrl+'<br>EPIs: '+x.epis+'</div>'+tag(x.status)+'</div><button class="btn btnY" onclick="cycle(\'ipdfs\',\''+id+'\',\'status\',[\'aberta\',\'em execução\',\'encerrada\'])">Mudar status</button><button class="btn btn2" onclick="pdfText(\'IPDF\',db.ipdfs.find(x=>x.id==\''+id+'\'))">Gerar comprovante</button>')}
function renderInsp(){$('insp').innerHTML='<h2>Inspeção de Campo</h2><div class="card"><button class="btn" onclick="openInsp()">Nova inspeção</button></div>'+list(db.insps,x=>'<div class="item"><b>'+x.tipo+' - '+x.frente+'</b><div class="meta">'+br(x.data)+' | NC: '+x.itens.filter(i=>i.st=='não conforme').length+'</div>'+tag(x.res)+'<button class="btn btn2" onclick="pdfText(\'Inspeção\',db.insps.find(a=>a.id==\''+x.id+'\'))">Comprovante</button></div>')}
const checks={EPI:['Capacete/jugular','Óculos/protetor facial','Luvas adequadas','Calçado de segurança','Protetor auricular'],Altura:['Cinto inspecionado','Talabarte/trava-quedas','Ancoragem segura','Área inferior isolada','Plano de resgate'],Ferramentas:['Cabos íntegros','Proteções instaladas','Disco/lâmina adequada','Ferramenta identificada','Armazenamento correto'],Escavação:['Acesso seguro','Talude/escoramento','Sinalização','Interferências verificadas','Material afastado da borda'],Limpeza:['Passagem livre','Resíduo destinado','Sem vazamento/óleo','Materiais organizados','Sinalização preservada']};
function openInsp(){modal('Nova inspeção','<label>Data<input id="nData" type="date" value="'+today()+'"></label><label>Frente/local<input id="nFrente"></label><label>Tipo<select id="nTipo" onchange="drawChecks()">'+Object.keys(checks).map(x=>'<option>'+x+'</option>').join('')+'</select></label><div id="chk"></div><button class="btn" onclick="saveInsp()">Salvar inspeção</button>');drawChecks()}function drawChecks(){let t=val('nTipo')||'EPI';$('chk').innerHTML=checks[t].map((c,i)=>'<div class="item"><b>'+c+'</b><label>Status<select class="cst"><option>conforme</option><option>não conforme</option><option>não aplicável</option></select></label><label>Observação<input class="cob"></label></div>').join('')}function saveInsp(){let itens=[...document.querySelectorAll('#chk .item')].map((el,i)=>({nome:checks[val('nTipo')][i],st:el.querySelector('.cst').value,obs:el.querySelector('.cob').value}));let r={id:uid(),data:val('nData'),frente:val('nFrente'),tipo:val('nTipo'),itens,res:itens.some(i=>i.st=='não conforme')?'com pendência':'conforme'};if(!r.frente)return toast('Informe a frente');db.insps.unshift(r);itens.filter(i=>i.st=='não conforme').forEach(i=>db.rncs.unshift({id:uid(),data:today(),desc:'NC em inspeção '+r.tipo+': '+i.nome+'. '+i.obs,local:r.frente,risco:'médio',resp:'A definir',prazo:add(3),status:'aberta'}));closeM();save()}
function renderEPI(){$('epi').innerHTML='<h2>Controle de EPI</h2><div class="card"><button class="btn" onclick="openEntrega()">Entregar EPI com assinatura</button><button class="btn btn2" onclick="openCadEPI()">Cadastrar EPI</button></div>'+list(db.epis,e=>'<div class="item"><b>'+e.nome+'</b><div class="meta">CA '+e.ca+' | Validade '+br(e.v)+' | Estoque '+e.est+' | Entregas '+e.ent.length+'</div>'+tag(days(e.v)<0?'CA vencido':e.est<=e.min?'estoque baixo':'ok')+'<button class="btn btn2" onclick="pdfText(\'Ficha EPI\',db.epis.find(x=>x.id==\''+e.id+'\'))">Ficha</button></div>')}
function openCadEPI(){modal('Cadastrar EPI','<label>Nome<input id="eNome"></label><label>CA<input id="eCA"></label><label>Validade CA<input id="eVal" type="date"></label><div class="row"><label>Estoque<input id="eEst" type="number"></label><label>Mínimo<input id="eMin" type="number" value="5"></label></div><button class="btn" onclick="saveCadEPI()">Salvar EPI</button>')}function saveCadEPI(){db.epis.unshift({id:uid(),nome:val('eNome'),ca:val('eCA'),v:val('eVal'),est:+val('eEst'),min:+val('eMin'),ent:[]});closeM();save()}function openEntrega(){modal('Entrega de EPI','<label>EPI<select id="dEpi">'+db.epis.map(e=>'<option value="'+e.id+'">'+e.nome+' | estoque '+e.est+'</option>').join('')+'</select></label><label>Funcionário<select id="dTrab">'+workerOptions()+'</select></label><label>Quantidade<input id="dQtd" type="number" value="1"></label><label>Observação<input id="dObs" placeholder="Entrega, troca, substituição..."></label><label>Assinatura do funcionário</label>'+sig('dSig')+'<button class="btn" onclick="saveEntrega()">Registrar entrega</button>')}function saveEntrega(){let e=db.epis.find(x=>x.id==val('dEpi')),w=db.workers.find(x=>x.id==val('dTrab')),q=+val('dQtd');if(!e||!w||q<1)return;if(e.est<q)return toast('Estoque insuficiente');e.est-=q;e.ent.unshift({id:uid(),data:today(),worker:w.id,nome:w.nome,q,obs:val('dObs'),sig:getSig('dSig')});closeM();save()}
function renderTrab(){$('trab').innerHTML='<h2>Trabalhadores</h2><div class="card"><button class="btn" onclick="openTrab()">Cadastrar trabalhador</button></div>'+list(db.workers,w=>'<div class="item"><b>'+w.nome+'</b><div class="meta">'+w.funcao+' | '+w.empresa+' | CPF '+w.cpf+'<br>ASO '+br(w.aso)+'</div>'+tag(apto(w))+'<button class="btn btn2" onclick="viewTrab(\''+w.id+'\')">Perfil</button></div>')}function openTrab(){modal('Novo trabalhador','<label>Nome<input id="wNome"></label><label>Função<input id="wFunc"></label><label>CPF<input id="wCpf"></label><label>Empresa<select id="wEmp"><option>Própria</option><option>Terceira</option></select></label><label>Validade ASO<input id="wAso" type="date"></label><label>NR<select id="wNr"><option>NR-06</option><option>NR-10</option><option>NR-12</option><option>NR-18</option><option>NR-33</option><option>NR-35</option></select></label><label>Validade NR<input id="wNrV" type="date"></label><button class="btn" onclick="saveTrab()">Salvar trabalhador</button>')}function saveTrab(){db.workers.unshift({id:uid(),nome:val('wNome'),funcao:val('wFunc'),cpf:val('wCpf'),empresa:val('wEmp'),aso:val('wAso'),nrs:[{nr:val('wNr'),v:val('wNrV')}]});closeM();save()}function viewTrab(id){let w=db.workers.find(x=>x.id==id),ents=db.epis.flatMap(e=>e.ent.filter(a=>a.worker==id).map(a=>e.nome+' em '+br(a.data)+' qtd '+a.q));modal('Perfil do trabalhador','<div class="item"><b>'+w.nome+'</b><div class="meta">Função: '+w.funcao+'<br>Empresa: '+w.empresa+'<br>ASO: '+br(w.aso)+'<br>NRs: '+w.nrs.map(n=>n.nr+' '+br(n.v)).join(', ')+'<br>EPIs: '+(ents.join('; ')||'nenhum')+'</div>'+tag(apto(w))+'</div><button class="btn btn2" onclick="pdfText(\'Ficha Trabalhador\',db.workers.find(x=>x.id==\''+id+'\'))">Gerar ficha</button>')}
function renderRNC(){$('rnc').innerHTML='<h2>RNC / Desvios</h2><div class="card"><button class="btn" onclick="openRNC()">Abrir RNC</button></div>'+list(db.rncs,r=>'<div class="item"><b>'+r.desc+'</b><div class="meta">'+r.local+' | Resp. '+r.resp+' | Prazo '+br(r.prazo)+'</div>'+tag(days(r.prazo)<0&&r.status!='encerrada'?'vencida':r.status)+'<button class="btn btnY" onclick="cycle(\'rncs\',\''+r.id+'\',\'status\',[\'aberta\',\'em tratativa\',\'verificação\',\'encerrada\'])">Avançar</button></div>')}function openRNC(){modal('Abrir RNC','<label>Descrição<textarea id="rDesc"></textarea></label><label>Local<input id="rLocal"></label><label>Risco<select id="rRisco"><option>baixo</option><option>médio</option><option>alto</option><option>crítico</option></select></label><label>Responsável<input id="rResp"></label><label>Prazo<input id="rPrazo" type="date" value="'+add(3)+'"></label><button class="btn" onclick="saveRNC()">Salvar RNC</button>')}function saveRNC(){db.rncs.unshift({id:uid(),data:today(),desc:val('rDesc'),local:val('rLocal'),risco:val('rRisco'),resp:val('rResp'),prazo:val('rPrazo'),status:'aberta'});closeM();save()}
function renderDDS(){$('dds').innerHTML='<h2>DDS</h2><div class="card"><button class="btn" onclick="openDDS()">Novo DDS</button></div>'+list(db.dds,d=>'<div class="item"><b>'+d.tema+'</b><div class="meta">'+br(d.data)+' | '+d.local+' | '+d.pres.length+' presentes</div><button class="btn btn2" onclick="pdfText(\'DDS\',db.dds.find(x=>x.id==\''+d.id+'\'))">Lista</button></div>')}function openDDS(){modal('Registrar DDS','<label>Data<input id="sData" type="date" value="'+today()+'"></label><label>Tema<select id="sTema"><option>Uso correto de EPI</option><option>Trabalho em altura</option><option>Ordem e limpeza</option><option>Escavação</option><option>Ferramentas manuais</option><option>Bloqueio de energia</option></select></label><label>Ministrador<input id="sMin"></label><label>Local<input id="sLocal"></label><label>Presentes<select id="sPres" multiple size="6">'+workerOptions()+'</select></label><label>Assinatura ministrador</label>'+sig('sSig')+'<button class="btn" onclick="saveDDS()">Salvar DDS</button>')}function saveDDS(){db.dds.unshift({id:uid(),data:val('sData'),tema:val('sTema'),min:val('sMin'),local:val('sLocal'),pres:selected('sPres'),sig:getSig('sSig')});closeM();save()}
function renderRel(){$('rel').innerHTML='<h2>Relatórios e Backup</h2><div class="card"><table><tr><th>Indicador</th><th>Total</th></tr><tr><td>Trabalhadores</td><td>'+db.workers.length+'</td></tr><tr><td>IPDF/APR</td><td>'+db.ipdfs.length+'</td></tr><tr><td>Inspeções</td><td>'+db.insps.length+'</td></tr><tr><td>RNC abertas</td><td>'+db.rncs.filter(x=>x.status!='encerrada').length+'</td></tr><tr><td>Entregas de EPI</td><td>'+db.epis.reduce((n,e)=>n+e.ent.length,0)+'</td></tr></table><button class="btn" onclick="backup()">Baixar backup JSON</button><button class="btn btnR" onclick="resetAll()">Apagar dados do aparelho</button></div>'}
function modal(t,b){$('mt').textContent=t;$('mb').innerHTML=b;$('modal').classList.add('on');setupSigs()}function closeM(){$('modal').classList.remove('on')}function val(id){return $(id)?.value?.trim()||''}function toast(m){alert(m)}function cycle(col,id,field,states){let o=db[col].find(x=>x.id==id),i=states.indexOf(o[field]);o[field]=states[(i+1)%states.length];closeM();save()}function pic(inp,id){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=$(id);im.src=r.result;im.style.display='block'};r.readAsDataURL(f)}function sig(id){return'<div class="sig" data-sig="'+id+'"><canvas></canvas><div><span class="meta">Assine com o dedo</span><button class="btn btn2" style="width:auto;margin:0" onclick="clearSig(this)">Limpar</button></div></div>'}function setupSigs(){document.querySelectorAll('.sig').forEach(box=>{if(box.ok)return;box.ok=1;let c=box.querySelector('canvas'),x=c.getContext('2d'),down=0,last=null;function size(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);x.strokeStyle='#00C896';x.lineWidth=3;x.lineCap='round'}function p(e){let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}function st(e){e.preventDefault();size();down=1;last=p(e)}function mv(e){if(!down)return;e.preventDefault();let q=p(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(q.x,q.y);x.stroke();last=q}function en(){down=0}setTimeout(size,50);c.addEventListener('mousedown',st);c.addEventListener('mousemove',mv);window.addEventListener('mouseup',en);c.addEventListener('touchstart',st,{passive:false});c.addEventListener('touchmove',mv,{passive:false});c.addEventListener('touchend',en)})}function clearSig(b){let c=b.closest('.sig').querySelector('canvas');c.getContext('2d').clearRect(0,0,c.width,c.height)}function getSig(id){let b=document.querySelector('[data-sig="'+id+'"]');return b?b.querySelector('canvas').toDataURL('image/png'):''}
function pdfText(title,obj){let w=window.open('','_blank');w.document.write('<pre style="font-family:Arial;white-space:pre-wrap">'+title+'\n\nEmpresa: '+db.cfg.empresa+'\nObra: '+db.cfg.obra+'\nData: '+new Date().toLocaleString('pt-BR')+'\n\n'+JSON.stringify(obj,null,2)+'</pre>');w.print()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='worksafepro-backup-'+today()+'.json';a.click()}function resetAll(){if(confirm('Apagar todos os dados deste aparelho?')){localStorage.removeItem(K);db=seed();save()}}render();
</script>
