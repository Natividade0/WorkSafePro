<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WorkSafePro</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#1e2a2f;font-family:Arial,sans-serif}.top{background:#0b6b55;color:white;padding:16px;position:sticky;top:0;z-index:5;box-shadow:0 4px 14px #0002}.top h1{margin:0;text-align:center;font-size:24px}.top small{display:block;text-align:center;color:#dff7ef;margin-top:4px}.main{padding:16px 16px 90px}.hero{background:linear-gradient(135deg,#0b6b55,#10a37f);color:white;border-radius:22px;padding:22px;margin-bottom:14px;box-shadow:0 8px 24px #0002}.hero h2{margin:0 0 8px;font-size:26px}.hero p{margin:0;line-height:1.4;color:#eafff8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.item{background:white;border:1px solid #dfe8e3;border-radius:18px;padding:16px;box-shadow:0 8px 20px #0001}.card strong{font-size:32px;color:#0b6b55}.card span{display:block;color:#6d7a80;font-size:13px}.module{display:grid;grid-template-columns:54px 1fr 20px;gap:12px;align-items:center;width:100%;background:white;border:1px solid #dfe8e3;border-radius:18px;padding:14px;margin-top:12px;text-align:left;box-shadow:0 8px 20px #0001}.ico{width:54px;height:54px;border-radius:15px;background:#e7f5ef;display:grid;place-items:center;font-size:28px}.module b{font-size:17px}.module small{display:block;color:#6d7a80;margin-top:4px}.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:#0b6b55;color:white;font-weight:bold;font-size:16px;margin-top:10px;padding:12px}.btn2{background:white;color:#0b6b55;border:1px solid #c8d8d1}.btnR{background:#fff0f2;color:#c73345;border:1px solid #f1c1c8}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dfe8e3;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;z-index:6}.bottom button{border:0;background:white;border-radius:14px;min-height:54px;color:#6d7a80;font-weight:bold}.bottom button.on{background:#e7f5ef;color:#0b6b55}.list{display:grid;gap:12px;margin-top:12px}.meta{color:#6d7a80;font-size:14px;line-height:1.45;margin-top:5px}.tag{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:bold;margin-top:6px}.ok{background:#e7f5ef;color:#0b6b55}.warn{background:#fff4dc;color:#a06000}.bad{background:#ffe6eb;color:#b92c3d}.empty{text-align:center;color:#87938f;padding:36px 10px;background:white;border:1px dashed #cfdcd6;border-radius:18px;margin-top:12px}.modal{position:fixed;inset:0;background:#0007;display:none;place-items:end;z-index:10}.modal.on{display:grid}.sheet{background:#f3f7f5;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px}.sheetHead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-16px;background:#f3f7f5;padding:6px 0 12px}.sheetHead h2{margin:0;font-size:21px}label{display:block;font-weight:bold;color:#4f5c61;font-size:14px;margin-top:12px}input,select,textarea{width:100%;min-height:52px;border:1px solid #bdcbc5;border-radius:12px;background:white;color:#1e2a2f;padding:12px;font-size:16px;margin-top:6px}textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:white;border:1px solid #dfe8e3;border-radius:14px;padding:12px;margin-top:10px}.sig{border:1px solid #0b6b55;border-radius:14px;overflow:hidden;margin-top:8px;background:white}.sig canvas{display:block;width:100%;height:190px;background:white;touch-action:none}.sigbar{display:flex;justify-content:space-between;align-items:center;padding:8px;background:#eef7f3;border-top:1px solid #dfe8e3}.printDoc{background:white;color:#111;padding:20px;font-family:Arial}.printHead{background:#0b6b55;color:white;border-radius:16px;padding:16px;margin-bottom:12px}.printBox{border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px;text-align:left}@media(min-width:760px){.main{max-width:900px;margin:auto}.modules{display:grid;grid-template-columns:1fr 1fr;gap:12px}.module{margin-top:0}.sheet{max-width:720px;border-radius:24px}}
</style>
</head>
<body>
<header class="top"><h1>WorkSafePro</h1><small>Segurança do Trabalho em Campo</small></header>
<main id="app" class="main"></main>
<nav class="bottom"><button id="b-home" onclick="go('home')">Início</button><button id="b-pt" onclick="go('pt')">PT</button><button id="b-insp" onclick="go('insp')">Inspeção</button><button id="b-epi" onclick="go('epi')">EPI</button></nav>
<div id="modal" class="modal"><div class="sheet"><div class="sheetHead"><h2 id="mt">Registro</h2><button class="btn btn2" style="width:auto;margin:0" onclick="closeM()">Fechar</button></div><div id="mb"></div></div></div>
<script>
var K='wsp-fixed-1';
var db=JSON.parse(localStorage.getItem(K)||'null')||{workers:[],epis:[],pts:[],insps:[],rncs:[],dds:[]};
var cur='home';
function el(id){return document.getElementById(id)}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function today(){return new Date().toISOString().slice(0,10)}
function br(d){return d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'-'}
function days(d){return d?Math.ceil((new Date(d+'T12:00:00')-new Date())/864e5):9999}
function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}
function save(){localStorage.setItem(K,JSON.stringify(db));render()}
function tag(s){var c=/venc|inap|não|nao|alto|crít/i.test(s)?'bad':/pend|abert|emit|trat/i.test(s)?'warn':'ok';return '<span class="tag '+c+'">'+esc(s)+'</span>'}
function apto(w){if(!w)return'inapto';if(days(w.aso)<0)return'inapto';if(days(w.aso)<=30)return'pendente';for(var i=0;i<(w.nrs||[]).length;i++){if(days(w.nrs[i].v)<0)return'inapto';if(days(w.nrs[i].v)<=30)return'pendente'}return'apto'}
function workerOptions(sel){sel=sel||[];return db.workers.map(function(w){return '<option value="'+w.id+'" '+(sel.includes(w.id)?'selected':'')+'>'+esc(w.nome)+' - '+esc(w.funcao)+' ('+apto(w)+')</option>'}).join('')}
function selected(id){return Array.from(el(id).selectedOptions).map(function(o){return o.value})}
function wname(id){var w=db.workers.find(function(x){return x.id==id});return w?w.nome:id}
function go(s,push){cur=s;if(push!==false)history.pushState({s:s},'', '#'+s);render();window.scrollTo(0,0)}
window.onpopstate=function(e){if(el('modal').classList.contains('on')){closeM();return}cur=(e.state&&e.state.s)||'home';render()}
function page(title,sub,body){return '<div class="hero"><h2>'+title+'</h2><p>'+sub+'</p></div>'+body}
function empty(t){return '<div class="empty">'+t+'</div>'}
function list(a,fn,t){return '<div class="list">'+(a.length?a.map(fn).join(''):empty(t))+'</div>'}
function render(){['home','pt','insp','epi'].forEach(function(x){var b=el('b-'+x);if(b)b.classList.toggle('on',cur==x)});if(cur=='home')return home();if(cur=='pt')return pts();if(cur=='insp')return insps();if(cur=='epi')return epis();if(cur=='trab')return trabs();if(cur=='rnc')return rncs();if(cur=='dds')return dds();if(cur=='rel')return rel();home()}
function home(){var epi=db.epis.filter(function(e){return days(e.v)<=30||Number(e.est)<=Number(e.min)}).length;el('app').innerHTML='<div class="hero"><h2>Segurança do Trabalho em Campo</h2><p>PT, inspeção, EPI, trabalhadores, RNC, DDS e PDF funcionando offline.</p></div><div class="grid"><div class="card"><strong>'+db.pts.length+'</strong><span>PTs</span></div><div class="card"><strong>'+db.insps.length+'</strong><span>Inspeções</span></div><div class="card"><strong>'+db.rncs.length+'</strong><span>RNC</span></div><div class="card"><strong>'+epi+'</strong><span>Alertas EPI</span></div></div><div class="modules" style="margin-top:16px">'+mod('📝','Permissão de Trabalho','Criar, editar, assinar e gerar PDF','pt')+mod('🔎','Inspeções de Segurança','Checklist flexível de campo','insp')+mod('🦺','Controle de EPIs','Estoque, CA e entrega','epi')+mod('👷','Trabalhadores','ASO e treinamentos NR','trab')+mod('⚠️','Não Conformidades','Prazos e responsáveis','rnc')+mod('💬','DDS','Diálogo diário de segurança','dds')+mod('📄','Relatórios e Backup','PDF e JSON','rel')+'</div>'}
function mod(i,t,s,g){return '<button class="module" onclick="go(\''+g+'\')"><div class="ico">'+i+'</div><div><b>'+t+'</b><small>'+s+'</small></div><div>›</div></button>'}
function pts(){el('app').innerHTML=page('Permissão de Trabalho','PT manual, editável, com assinatura e PDF.','<button class="btn" onclick="openPT()">Nova PT</button>'+list(db.pts,function(p){return '<div class="item"><b>'+esc(p.tipo)+' - '+esc(p.local)+'</b><div class="meta">'+br(p.data)+' até '+br(p.validade)+'<br>Executantes: '+esc((p.execs||[]).map(wname).join(', '))+'</div>'+tag(p.status)+'<button class="btn btn2" onclick="openPT(\''+p.id+'\')">Editar</button><button class="btn" onclick="printDoc(\'Permissão de Trabalho\',db.pts.find(x=>x.id==\''+p.id+'\'))">PDF</button><button class="btn btnR" onclick="del(\'pts\',\''+p.id+'\')">Apagar</button></div>'},'Nenhuma PT cadastrada.'))}
function openPT(id){var p=db.pts.find(function(x){return x.id==id})||{tipo:'Manual geral',data:today(),validade:today(),local:'',atividade:'',execs:[],riscos:[],controles:[],check:[],status:'emitida',sig:{nome:'',img:''}};modal(id?'Editar PT':'Nova PT','<label>Tipo<select id="pTipo"><option>Manual geral</option><option>Altura</option><option>Espaço confinado</option><option>Trabalho a quente</option><option>Escavação</option><option>Elétrica/LOTO</option></select></label><div class="row"><label>Data<input id="pData" type="date" value="'+p.data+'"></label><label>Validade<input id="pVal" type="date" value="'+p.validade+'"></label></div><label>Local<input id="pLocal" value="'+esc(p.local)+'"></label><label>Atividade<textarea id="pAtiv">'+esc(p.atividade)+'</textarea></label><label>Executantes<select id="pExec" multiple size="5">'+workerOptions(p.execs)+'</select></label><h3>Riscos</h3><div id="risk">'+p.riscos.map(function(x){return row('riskI',x)}).join('')+'</div><button class="btn btn2" onclick="addRow(\'risk\',\'riskI\')">+ Risco</button><h3>Controles</h3><div id="ctrl">'+p.controles.map(function(x){return row('ctrlI',x)}).join('')+'</div><button class="btn btn2" onclick="addRow(\'ctrl\',\'ctrlI\')">+ Controle</button><h3>Checklist</h3><div id="chk">'+p.check.map(function(x){return chkrow(x.item,x.status,x.obs)}).join('')+'</div><button class="btn btn2" onclick="addChk()">+ Item</button><label>Nome do assinante<input id="pAss" value="'+esc(p.sig.nome)+'"></label>'+sig('pSig')+'<button class="btn" onclick="savePT(\''+(id||'')+'\')">Salvar</button>');el('pTipo').value=p.tipo}
function row(cls,v){return '<div class="box"><div class="row"><input class="'+cls+'" value="'+esc(v)+'"><button class="btn btnR" onclick="this.closest(\'.box\').remove()">Apagar</button></div></div>'}
function addRow(box,cls){el(box).insertAdjacentHTML('beforeend',row(cls,''))}
function chkrow(i,s,o){return '<div class="box"><label>Item<input class="chkI" value="'+esc(i||'')+'"></label><label>Status<select class="chkS"><option '+(s=='conforme'?'selected':'')+'>conforme</option><option '+(s=='não aplicável'?'selected':'')+'>não aplicável</option><option '+(s=='não conforme'?'selected':'')+'>não conforme</option></select></label><label>Obs<input class="chkO" value="'+esc(o||'')+'"></label><button class="btn btnR" onclick="this.closest(\'.box\').remove()">Apagar</button></div>'}
function addChk(){el('chk').insertAdjacentHTML('beforeend',chkrow('','conforme',''))}
function savePT(id){var old=db.pts.find(function(x){return x.id==id});var p={id:id||uid(),tipo:el('pTipo').value,data:el('pData').value,validade:el('pVal').value,local:el('pLocal').value,atividade:el('pAtiv').value,execs:selected('pExec'),riscos:Array.from(document.querySelectorAll('.riskI')).map(function(x){return x.value}).filter(Boolean),controles:Array.from(document.querySelectorAll('.ctrlI')).map(function(x){return x.value}).filter(Boolean),check:Array.from(document.querySelectorAll('.chkI')).map(function(x,i){return{item:x.value,status:document.querySelectorAll('.chkS')[i].value,obs:document.querySelectorAll('.chkO')[i].value}}).filter(function(x){return x.item}),status:old?old.status:'emitida',sig:{nome:el('pAss').value,img:getSig('pSig')||(old&&old.sig?old.sig.img:'')}};if(!p.local||!p.atividade)return alert('Preencha local e atividade.');if(id)db.pts=db.pts.map(function(x){return x.id==id?p:x});else db.pts.unshift(p);closeM();save();cur='pt';render()}
function insps(){el('app').innerHTML=page('Inspeções de Segurança','Checklist personalizado com PDF.','<button class="btn" onclick="openInsp()">Nova Inspeção</button>'+list(db.insps,function(x){return '<div class="item"><b>'+esc(x.tipo)+' - '+esc(x.local)+'</b><div class="meta">Itens: '+x.itens.length+'</div>'+tag(x.resultado)+'<button class="btn btn2" onclick="openInsp(\''+x.id+'\')">Editar</button><button class="btn" onclick="printDoc(\'Inspeção\',db.insps.find(a=>a.id==\''+x.id+'\'))">PDF</button><button class="btn btnR" onclick="del(\'insps\',\''+x.id+'\')">Apagar</button></div>'},'Nenhuma inspeção cadastrada.'))}
function openInsp(id){var x=db.insps.find(function(a){return a.id==id})||{tipo:'',local:'',empresa:'',resp:'',itens:[]};modal(id?'Editar Inspeção':'Nova Inspeção','<label>Tipo<input id="iTipo" value="'+esc(x.tipo)+'"></label><label>Local<input id="iLocal" value="'+esc(x.local)+'"></label><label>Empresa<input id="iEmp" value="'+esc(x.empresa)+'"></label><label>Responsável<input id="iResp" value="'+esc(x.resp)+'"></label><h3>Perguntas</h3><div id="ibox">'+x.itens.map(function(i){return chkrow(i.item,i.status,i.obs)}).join('')+'</div><button class="btn btn2" onclick="el(\'ibox\').insertAdjacentHTML(\'beforeend\',chkrow(\'\',\'conforme\',\'\'))">+ Pergunta</button><button class="btn" onclick="saveInsp(\''+(id||'')+'\')">Salvar</button>')}
function saveInsp(id){var itens=Array.from(document.querySelectorAll('.chkI')).map(function(x,i){return{item:x.value,status:document.querySelectorAll('.chkS')[i].value,obs:document.querySelectorAll('.chkO')[i].value}}).filter(function(x){return x.item});var r={id:id||uid(),tipo:el('iTipo').value,local:el('iLocal').value,empresa:el('iEmp').value,resp:el('iResp').value,itens:itens,resultado:itens.some(function(i){return i.status=='não conforme'})?'com pendência':'conforme'};if(id)db.insps=db.insps.map(function(x){return x.id==id?r:x});else db.insps.unshift(r);closeM();save();cur='insp';render()}
function epis(){el('app').innerHTML=page('Controle de EPIs','CA, estoque e entrega com assinatura.','<button class="btn" onclick="openEPI()">Adicionar EPI</button><button class="btn btn2" onclick="openEntrega()">Registrar entrega</button>'+list(db.epis,function(e){return '<div class="item"><b>'+esc(e.nome)+'</b><div class="meta">CA '+esc(e.ca)+' | Validade '+br(e.v)+' | Estoque '+e.est+'</div>'+tag(days(e.v)<0?'CA vencido':Number(e.est)<=Number(e.min)?'estoque baixo':'ok')+'<button class="btn btn2" onclick="openEPI(\''+e.id+'\')">Editar</button><button class="btn" onclick="printDoc(\'EPI\',db.epis.find(a=>a.id==\''+e.id+'\'))">PDF</button><button class="btn btnR" onclick="del(\'epis\',\''+e.id+'\')">Apagar</button></div>'},'Nenhum EPI cadastrado.'))}
function openEPI(id){var e=db.epis.find(function(x){return x.id==id})||{nome:'',ca:'',v:'',est:0,min:0,ent:[]};modal(id?'Editar EPI':'Adicionar EPI','<label>Nome<input id="eNome" value="'+esc(e.nome)+'"></label><label>CA<input id="eCA" value="'+esc(e.ca)+'"></label><label>Validade<input id="eVal" type="date" value="'+e.v+'"></label><div class="row"><label>Estoque<input id="eEst" type="number" value="'+e.est+'"></label><label>Mínimo<input id="eMin" type="number" value="'+e.min+'"></label></div><button class="btn" onclick="saveEPI(\''+(id||'')+'\')">Salvar</button>')}
function saveEPI(id){var old=db.epis.find(function(x){return x.id==id})||{ent:[]};var e={id:id||uid(),nome:el('eNome').value,ca:el('eCA').value,v:el('eVal').value,est:+el('eEst').value,min:+el('eMin').value,ent:old.ent};if(id)db.epis=db.epis.map(function(x){return x.id==id?e:x});else db.epis.unshift(e);closeM();save();cur='epi';render()}
function openEntrega(){modal('Entrega de EPI','<label>EPI<select id="dEpi">'+db.epis.map(function(e){return '<option value="'+e.id+'">'+esc(e.nome)+' | estoque '+e.est+'</option>'}).join('')+'</select></label><label>Funcionário<select id="dTrab">'+workerOptions([])+'</select></label><label>Quantidade<input id="dQtd" type="number" value="1"></label><label>Observação<input id="dObs"></label>'+sig('dSig')+'<button class="btn" onclick="saveEntrega()">Salvar entrega</button>')}
function saveEntrega(){var e=db.epis.find(function(x){return x.id==el('dEpi').value}),w=db.workers.find(function(x){return x.id==el('dTrab').value}),q=+el('dQtd').value;if(!e||!w)return alert('Cadastre EPI e trabalhador antes.');if(e.est<q)return alert('Estoque insuficiente.');e.est-=q;e.ent.unshift({id:uid(),data:today(),worker:w.id,nome:w.nome,q:q,obs:el('dObs').value,sig:getSig('dSig')});closeM();save();cur='epi';render()}
function trabs(){el('app').innerHTML=page('Trabalhadores','ASO, função, empresa e treinamentos.','<button class="btn" onclick="openTrab()">Adicionar Trabalhador</button>'+list(db.workers,function(w){return '<div class="item"><b>'+esc(w.nome)+'</b><div class="meta">'+esc(w.funcao)+' | '+esc(w.empresa)+' | ASO '+br(w.aso)+'</div>'+tag(apto(w))+'<button class="btn btn2" onclick="openTrab(\''+w.id+'\')">Editar</button><button class="btn" onclick="printDoc(\'Trabalhador\',db.workers.find(a=>a.id==\''+w.id+'\'))">PDF</button><button class="btn btnR" onclick="del(\'workers\',\''+w.id+'\')">Apagar</button></div>'},'Nenhum trabalhador cadastrado.'))}
function openTrab(id){var w=db.workers.find(function(x){return x.id==id})||{nome:'',funcao:'',cpf:'',empresa:'',aso:'',nrs:[]};modal(id?'Editar Trabalhador':'Adicionar Trabalhador','<label>Nome<input id="wNome" value="'+esc(w.nome)+'"></label><label>Função<input id="wFunc" value="'+esc(w.funcao)+'"></label><label>CPF<input id="wCpf" value="'+esc(w.cpf)+'"></label><label>Empresa<input id="wEmp" value="'+esc(w.empresa)+'"></label><label>Validade ASO<input id="wAso" type="date" value="'+w.aso+'"></label><h3>NRs</h3><div id="nrbox">'+w.nrs.map(function(n){return '<div class="box"><div class="row"><input class="nr" value="'+esc(n.nr)+'"><input class="nrv" type="date" value="'+n.v+'"></div><button class="btn btnR" onclick="this.closest(\'.box\').remove()">Apagar NR</button></div>'}).join('')+'</div><button class="btn btn2" onclick="el(\'nrbox\').insertAdjacentHTML(\'beforeend\',\'<div class=&quot;box&quot;><div class=&quot;row&quot;><input class=&quot;nr&quot; placeholder=&quot;NR-35&quot;><input class=&quot;nrv&quot; type=&quot;date&quot;></div><button class=&quot;btn btnR&quot; onclick=&quot;this.closest(\\\'.box\\\').remove()&quot;>Apagar NR</button></div>\')">+ NR</button><button class="btn" onclick="saveTrab(\''+(id||'')+'\')">Salvar</button>')}
function saveTrab(id){var w={id:id||uid(),nome:el('wNome').value,funcao:el('wFunc').value,cpf:el('wCpf').value,empresa:el('wEmp').value,aso:el('wAso').value,nrs:Array.from(document.querySelectorAll('.nr')).map(function(n,i){return{nr:n.value.toUpperCase(),v:document.querySelectorAll('.nrv')[i].value}}).filter(function(n){return n.nr})};if(id)db.workers=db.workers.map(function(x){return x.id==id?w:x});else db.workers.unshift(w);closeM();save();cur='trab';render()}
function rncs(){el('app').innerHTML=page('Não Conformidades','Desvios, prazo e responsável.','<button class="btn" onclick="openRNC()">Adicionar RNC</button>'+list(db.rncs,function(r){return '<div class="item"><b>'+esc(r.desc)+'</b><div class="meta">'+esc(r.local)+' | prazo '+br(r.prazo)+'</div>'+tag(r.status)+'<button class="btn btn2" onclick="openRNC(\''+r.id+'\')">Editar</button><button class="btn" onclick="printDoc(\'RNC\',db.rncs.find(a=>a.id==\''+r.id+'\'))">PDF</button><button class="btn btnR" onclick="del(\'rncs\',\''+r.id+'\')">Apagar</button></div>'},'Nenhuma RNC cadastrada.'))}
function openRNC(id){var r=db.rncs.find(function(x){return x.id==id})||{desc:'',local:'',resp:'',prazo:'',status:'aberta'};modal(id?'Editar RNC':'Adicionar RNC','<label>Descrição<textarea id="rDesc">'+esc(r.desc)+'</textarea></label><label>Local<input id="rLocal" value="'+esc(r.local)+'"></label><label>Responsável<input id="rResp" value="'+esc(r.resp)+'"></label><label>Prazo<input id="rPrazo" type="date" value="'+r.prazo+'"></label><label>Status<select id="rStatus"><option>aberta</option><option>em tratativa</option><option>verificação</option><option>encerrada</option></select></label><button class="btn" onclick="saveRNC(\''+(id||'')+'\')">Salvar</button>');el('rStatus').value=r.status}
function saveRNC(id){var r={id:id||uid(),desc:el('rDesc').value,local:el('rLocal').value,resp:el('rResp').value,prazo:el('rPrazo').value,status:el('rStatus').value};if(id)db.rncs=db.rncs.map(function(x){return x.id==id?r:x});else db.rncs.unshift(r);closeM();save();cur='rnc';render()}
function dds(){el('app').innerHTML=page('DDS','Diálogo diário de segurança.','<button class="btn" onclick="openDDS()">Adicionar DDS</button>'+list(db.dds,function(d){return '<div class="item"><b>'+esc(d.tema)+'</b><div class="meta">'+br(d.data)+' | '+esc(d.local)+'</div><button class="btn btn2" onclick="openDDS(\''+d.id+'\')">Editar</button><button class="btn" onclick="printDoc(\'DDS\',db.dds.find(a=>a.id==\''+d.id+'\'))">PDF</button><button class="btn btnR" onclick="del(\'dds\',\''+d.id+'\')">Apagar</button></div>'},'Nenhum DDS cadastrado.'))}
function openDDS(id){var d=db.dds.find(function(x){return x.id==id})||{data:today(),tema:'',min:'',local:'',pres:[]};modal(id?'Editar DDS':'Adicionar DDS','<label>Data<input id="sData" type="date" value="'+d.data+'"></label><label>Tema<input id="sTema" value="'+esc(d.tema)+'"></label><label>Ministrador<input id="sMin" value="'+esc(d.min)+'"></label><label>Local<input id="sLocal" value="'+esc(d.local)+'"></label><label>Presentes<select id="sPres" multiple size="5">'+workerOptions(d.pres)+'</select></label>'+sig('sSig')+'<button class="btn" onclick="saveDDS(\''+(id||'')+'\')">Salvar</button>')}
function saveDDS(id){var d={id:id||uid(),data:el('sData').value,tema:el('sTema').value,min:el('sMin').value,local:el('sLocal').value,pres:selected('sPres'),sig:getSig('sSig')};if(id)db.dds=db.dds.map(function(x){return x.id==id?d:x});else db.dds.unshift(d);closeM();save();cur='dds';render()}
function rel(){el('app').innerHTML=page('Relatórios e Backup','Gere PDF e salve backup.','<div class="item"><table><tr><th>Indicador</th><th>Total</th></tr><tr><td>Trabalhadores</td><td>'+db.workers.length+'</td></tr><tr><td>PTs</td><td>'+db.pts.length+'</td></tr><tr><td>Inspeções</td><td>'+db.insps.length+'</td></tr><tr><td>EPIs</td><td>'+db.epis.length+'</td></tr><tr><td>RNC</td><td>'+db.rncs.length+'</td></tr><tr><td>DDS</td><td>'+db.dds.length+'</td></tr></table><button class="btn" onclick="printDoc(\'Relatório Gerencial\',db)">PDF gerencial</button><button class="btn btn2" onclick="backup()">Backup JSON</button><button class="btn btnR" onclick="resetAll()">Apagar dados</button></div>')}
function del(col,id){if(confirm('Apagar este registro?')){db[col]=db[col].filter(function(x){return x.id!=id});save()}}
function modal(t,b){el('mt').textContent=t;el('mb').innerHTML=b;el('modal').classList.add('on');setupSigs()}
function closeM(){el('modal').classList.remove('on')}
function sig(id){return '<div class="sig" data-sig="'+id+'"><canvas></canvas><div class="sigbar"><span>Assine com o dedo</span><button class="btn btn2" style="width:auto;margin:0" onclick="clearSig(this)">Limpar</button></div></div>'}
function setupSigs(){document.querySelectorAll('.sig').forEach(function(box){if(box.ok)return;box.ok=1;var c=box.querySelector('canvas'),ctx=c.getContext('2d'),down=false,last=null;function size(){var r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.strokeStyle='#0b6b55';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round'}function pos(e){var r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}function start(e){e.preventDefault();if(!c.width)size();down=true;last=pos(e)}function move(e){if(!down)return;e.preventDefault();var p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}function end(){down=false}setTimeout(size,100);c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',end);c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);window.addEventListener('mouseup',end)})}
function clearSig(b){var c=b.closest('.sig').querySelector('canvas');c.getContext('2d').clearRect(0,0,c.width,c.height)}
function getSig(id){var b=document.querySelector('[data-sig="'+id+'"]');return b&&b.querySelector('canvas').width?b.querySelector('canvas').toDataURL('image/png'):''}
function printDoc(title,obj){var w=window.open('','_blank');w.document.write('<html><head><title>'+title+'</title></head><body><div style="font-family:Arial;padding:20px"><div style="background:#0b6b55;color:white;padding:16px;border-radius:12px"><h1>WorkSafePro</h1><b>'+title+'</b><br>'+new Date().toLocaleString('pt-BR')+'</div><pre style="white-space:pre-wrap;font-family:Arial;border:1px solid #ddd;padding:12px;border-radius:12px">'+esc(JSON.stringify(obj,null,2))+'</pre></div><script>setTimeout(()=>print(),500)<\/script></body></html>')}
function backup(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='worksafepro-backup-'+today()+'.json';a.click()}
function resetAll(){if(confirm('Apagar todos os dados?')){localStorage.removeItem(K);db={workers:[],epis:[],pts:[],insps:[],rncs:[],dds:[]};save()}}
history.replaceState({s:'home'},'','#home');render();
</script>
</body>
</html>
